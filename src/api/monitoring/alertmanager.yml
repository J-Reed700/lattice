# Alertmanager configuration for routing and notifications

global:
  resolve_timeout: 5m
  slack_api_url: ${SLACK_WEBHOOK_URL}
  smtp_smarthost: ${SMTP_HOST:-localhost:587}
  smtp_from: ${SMTP_FROM:-alerts@vault.dev}
  smtp_auth_username: ${SMTP_USERNAME}
  smtp_auth_password: ${SMTP_PASSWORD}

# Templates for notifications
templates:
  - '/etc/alertmanager/templates/*.tmpl'

# Route tree
route:
  # Default receiver
  receiver: 'default'

  # Group alerts by these labels
  group_by: ['alertname', 'cluster', 'service']

  # How long to wait before sending initial notification
  group_wait: 10s

  # How long to wait before sending notification about new alerts
  group_interval: 10s

  # How long to wait before sending notification about resolved alerts
  repeat_interval: 12h

  # Child routes
  routes:
    # Critical alerts - immediate notification
    - match:
        severity: critical
      receiver: critical-alerts
      group_wait: 0s
      repeat_interval: 5m
      continue: true

    # Warning alerts - less frequent
    - match:
        severity: warning
      receiver: warning-alerts
      group_wait: 30s
      repeat_interval: 4h

    # Info alerts - low priority
    - match:
        severity: info
      receiver: info-alerts
      group_wait: 5m
      repeat_interval: 24h

    # Database alerts - dedicated channel
    - match:
        component: database
      receiver: database-alerts
      continue: true

    # Security alerts - high priority
    - match_re:
        alertname: '(Unauthorized|Authentication|SecurityBreach).*'
      receiver: security-alerts
      group_wait: 0s
      repeat_interval: 1h

# Inhibition rules - suppress alerts when others are firing
inhibit_rules:
  # Inhibit warning if critical is firing for same alert
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'cluster', 'service']

  # Inhibit all alerts if application is down
  - source_match:
      alertname: 'ApplicationDown'
    target_match_re:
      alertname: '.*'
    equal: ['cluster', 'service']

# Receiver definitions
receivers:
  # Default receiver
  - name: 'default'
    email_configs:
      - to: ${ALERT_EMAIL:-ops@vault.dev}
        send_resolved: true
        headers:
          Subject: '[Vault Alert] {{ .GroupLabels.alertname }}'

  # Critical alerts - multiple channels
  - name: 'critical-alerts'
    email_configs:
      - to: ${CRITICAL_EMAIL:-ops@vault.dev}
        send_resolved: true
        headers:
          Subject: '[CRITICAL] {{ .GroupLabels.alertname }}'

    slack_configs:
      - channel: '#vault-critical-alerts'
        send_resolved: true
        title: 'Critical Alert: {{ .GroupLabels.alertname }}'
        text: |
          {{ range .Alerts }}
          *Alert:* {{ .Labels.alertname }}
          *Severity:* {{ .Labels.severity }}
          *Description:* {{ .Annotations.description }}
          *Runbook:* {{ .Annotations.runbook_url }}
          {{ end }}
        actions:
          - type: button
            text: 'View in Prometheus'
            url: '{{ .GeneratorURL }}'

    # Uncomment for PagerDuty integration
    # pagerduty_configs:
    #   - service_key: ${PAGERDUTY_SERVICE_KEY}
    #     send_resolved: true

  # Warning alerts
  - name: 'warning-alerts'
    slack_configs:
      - channel: '#vault-alerts'
        send_resolved: true
        title: 'Warning: {{ .GroupLabels.alertname }}'
        text: |
          {{ range .Alerts }}
          *Alert:* {{ .Labels.alertname }}
          *Description:* {{ .Annotations.description }}
          {{ end }}

  # Info alerts
  - name: 'info-alerts'
    email_configs:
      - to: ${INFO_EMAIL:-ops@vault.dev}
        send_resolved: true

  # Database alerts
  - name: 'database-alerts'
    slack_configs:
      - channel: '#vault-database-alerts'
        send_resolved: true
        title: 'Database Alert: {{ .GroupLabels.alertname }}'

  # Security alerts
  - name: 'security-alerts'
    email_configs:
      - to: ${SECURITY_EMAIL:-security@vault.dev}
        send_resolved: true
        headers:
          Subject: '[SECURITY] {{ .GroupLabels.alertname }}'

    slack_configs:
      - channel: '#vault-security-alerts'
        send_resolved: true
        title: 'Security Alert: {{ .GroupLabels.alertname }}'
        color: 'danger'
