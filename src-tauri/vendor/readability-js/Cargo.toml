[package]
name = "readability-js"
version = "0.1.5"
edition = "2024"
description = "A Rust wrapper for Mozilla's Readability.js library"
license = "UPL-1.0"
repository = "https://github.com/egemengol/readability-js"
readme = "README.md"

[dependencies]
rquickjs = { version = "=0.14.0", default-features = false, features = ["std"] }
serde = { version = "1.0", optional = true, features = ["derive"] }
thiserror = "2.0.16"
url = "2.5"

[features]
default = []
serde = ["dep:serde"]
