name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel in-flight runs for the same ref when a new commit lands.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Build on each supported platform to catch target-specific dependencies.
  rust-check:
    name: cargo check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Intel source checks precede publication of its first sidecar. This
    # debug-only override cannot produce a release bundle; the package job
    # below builds and verifies a real sidecar instead.
    env:
      LATTICE_ALLOW_UNPINNED_SIDECAR: ${{ matrix.os == 'macos-15-intel' && '1' || '0' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, macos-15-intel, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install Linux system deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          # Tauri 2 + webkit dependencies on Ubuntu.
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src-tauri/target/
          key: cargo-${{ matrix.os }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            cargo-${{ matrix.os }}-

      # Debug builds accept empty sidecars; the sidecar-binaries job checks
      # the real ones.
      - name: Create build placeholders for source checks
        shell: bash
        run: |
          mkdir -p dist
          case "${{ runner.os }}" in
            Linux) touch src-tauri/binaries/llama-server-x86_64-unknown-linux-gnu \
                         src-tauri/binaries/llama-server-cpu-x86_64-unknown-linux-gnu ;;
            macOS) triple="$(rustc -vV | awk '/^host:/ {print $2}')"
                   touch "src-tauri/binaries/llama-server-$triple" ;;
            Windows) touch src-tauri/binaries/llama-server-x86_64-pc-windows-msvc.exe \
                           src-tauri/binaries/llama-server-cpu-x86_64-pc-windows-msvc.exe ;;
          esac

      - name: cargo check
        working-directory: src-tauri
        run: cargo check --all-targets

      # Prove the manifest is actually in the executables rather than inferring
      # it from a green run. The first attempt at this fix emitted link args
      # that Cargo silently dropped for the lib harness, and a passing job
      # would have looked the same as a working one.
      - name: Windows manifest is embedded in the test executables
        if: matrix.os == 'windows-latest'
        working-directory: src-tauri
        shell: pwsh
        run: |
          $mt = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin\*\x64\mt.exe' |
                Sort-Object FullName | Select-Object -Last 1
          if (-not $mt) { throw "mt.exe not found in the Windows SDK" }
          # The manifest is only valid if mt.exe can parse it, and link.exe
          # reports a bad one as LNK1327 from inside a 12-minute build. Checking
          # it as XML first turns that into an immediate, obvious failure.
          try { [xml](Get-Content -Raw windows-app.manifest) | Out-Null }
          catch { throw "windows-app.manifest is not well-formed XML: $_" }
          # Keep the JSON in a file: piping it straight into ConvertFrom-Json
          # eats the compiler diagnostics, which live on the same stream, and
          # turns a build failure into a misleading "no test executables".
          $json = Join-Path $env:RUNNER_TEMP 'testbuild.json'
          cargo test --lib --bin export_bindings --test sidecar_guard_test --no-run --message-format=json > $json
          if ($LASTEXITCODE -ne 0) {
            Get-Content $json | ForEach-Object {
              $m = $null; try { $m = $_ | ConvertFrom-Json } catch { }
              if ($m -and $m.reason -eq 'compiler-message' -and $m.message.rendered) { Write-Host $m.message.rendered }
            }
            throw "building the test executables failed (diagnostics above)"
          }
          $exes = Get-Content $json | ForEach-Object {
                    $m = $null; try { $m = $_ | ConvertFrom-Json } catch { }
                    if ($m -and $m.executable) { $m.executable }
                  }
          if (-not $exes) { throw "cargo reported no test executables" }
          foreach ($exe in $exes) {
            $out = Join-Path $env:RUNNER_TEMP ([IO.Path]::GetFileNameWithoutExtension($exe) + ".manifest")
            & $mt.FullName -nologo -inputresource:"$exe;#1" -out:$out
            if ($LASTEXITCODE -ne 0) { throw "no RT_MANIFEST #1 resource in $exe" }
            if (-not (Select-String -Path $out -Pattern 'Microsoft.Windows.Common-Controls' -Quiet)) {
              throw "$exe has a manifest but no Common-Controls v6 dependency"
            }
            Write-Host "OK $exe"
          }

      - name: Desktop Rust unit and repository tests
        working-directory: src-tauri
        run: cargo test --lib --bin export_bindings --test sidecar_guard_test

      - name: Audit and credential backend integration tests
        working-directory: src-tauri
        run: cargo test --test security_audit_logging_test --test native_keyring_backend_test

      # The crate defines additional safety lints in Cargo.toml. Existing
      # warnings are not promoted to errors yet.
      - name: cargo clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets

      - name: generated bindings are current
        working-directory: src-tauri
        run: cargo run --bin export_bindings -- --check

      - name: cargo fmt --check
        working-directory: src-tauri
        run: cargo fmt --all -- --check

  # The pinned llama-server release must exist, match the lock's checksums, be
  # self-contained, and start on every platform we ship.
  sidecar-binaries:
    name: sidecar binaries (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-14, windows-2022]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Verifier unit tests
        run: python -m unittest src-tauri/scripts/test_verify_llama_binaries.py

      # Users' GPU drivers provide the Vulkan loader system-wide; install it so
      # the Vulkan builds are run rather than skipped.
      - name: Install Vulkan loader (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libvulkan1

      - name: Download Vulkan loader (Windows)
        if: runner.os == 'Windows'
        uses: jakoch/install-vulkan-sdk-action@v1.6.0
        with:
          vulkan_version: 1.3.290.0
          install_runtime_only: true
          cache: true

      - name: Install Vulkan loader (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Copy-Item "C:\VulkanSDK\1.3.290.0\runtime\x64\vulkan-1.dll" "$env:SystemRoot\System32\vulkan-1.dll" -Force

      - name: Fetch, verify and run the pinned binaries
        shell: bash
        run: bash src-tauri/scripts/fetch-llama-binaries.sh --strict

  desktop-compatibility:
    name: Desktop compatibility (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    # Intel hosted runners need close to an hour for the release link alone
    # after building the native x64 sidecar. Leave room for the actual package
    # and runtime checks instead of cancelling a healthy build at minute 60.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS-Apple-Silicon, os: macos-15, intel: false }
          - { name: macOS-Intel, os: macos-15-intel, intel: true }
          - { name: Ubuntu-24.04-x64, os: ubuntu-24.04, intel: false }
          # Hosted Windows runners use Server, not Windows 11. Keep the actual
          # runner visible; Windows 11 installation remains a release check.
          - { name: Windows-x64-Server-2025, os: windows-2025, intel: false }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf libvulkan1 xvfb
      - name: Windows Vulkan loader
        if: runner.os == 'Windows'
        uses: jakoch/install-vulkan-sdk-action@v1.6.0
        with:
          vulkan_version: 1.3.290.0
          install_runtime_only: true
          cache: true
      - name: Install Windows Vulkan loader
        if: runner.os == 'Windows'
        shell: pwsh
        run: Copy-Item "C:\VulkanSDK\1.3.290.0\runtime\x64\vulkan-1.dll" "$env:SystemRoot\System32\vulkan-1.dll" -Force
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: desktop-compatibility-${{ matrix.name }}
      - name: Fetch verified published sidecars
        if: ${{ !matrix.intel }}
        shell: bash
        run: bash src-tauri/scripts/fetch-llama-binaries.sh --strict
      - name: Build and execute Intel sidecar candidate
        if: matrix.intel
        run: bash src-tauri/scripts/build-intel-macos-sidecar.sh
      - name: Pin verified Intel candidate for this CI bundle only
        if: matrix.intel
        shell: bash
        run: |
          python3 - <<'PYCODE'
          import hashlib
          from pathlib import Path
          root = Path('src-tauri')
          binary = root / 'binaries/llama-server-x86_64-apple-darwin'
          lock = root / 'scripts/llama-server.lock'
          lines = [line for line in lock.read_text().splitlines()
                   if not (line.startswith('sha256 ') and line.endswith(' ' + binary.name))]
          lines.append(f'sha256 {hashlib.sha256(binary.read_bytes()).hexdigest()} {binary.name}')
          lock.write_text('\n'.join(lines) + '\n')
          PYCODE
      - run: npm ci
      - name: Build and install isolated package candidate
        run: npm run test:desktop:build -- --release
      - name: Exercise the native desktop app (macOS and Windows)
        if: runner.os != 'Linux'
        run: npm run test:desktop
      - name: Exercise the native desktop app (Linux display session)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum npm run test:desktop
      - name: Generate text with the packaged CPU engine
        shell: bash
        run: |
          curl --fail --location --retry 3 --max-time 60 \
            https://huggingface.co/ggml-org/models-moved/resolve/main/tinyllamas/stories260K.gguf \
            -o "$RUNNER_TEMP/stories260K.gguf"
          binary="$(node --input-type=module -e "import fs from 'node:fs'; const m=JSON.parse(fs.readFileSync('e2e-results/desktop/manifest.json')); console.log(m.sidecar)")"
          python3 src-tauri/scripts/smoke_llama_cpu.py "$binary" "$RUNNER_TEMP/stories260K.gguf" | tee e2e-results/desktop/reports/cpu-generation.json
      - name: Upload results, screenshots and native logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-compatibility-${{ matrix.name }}
          path: |
            e2e-results/desktop/reports/
            e2e-results/desktop/manifest.json
            e2e-results/desktop/config.json
          if-no-files-found: warn

  # Syntax-aware layer checks complement the filesystem-state guard.
  repository-barrier:
    name: architecture boundary checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --locked --manifest-path scripts/rust-architecture-check/Cargo.toml
      - run: bash scripts/check-repository-barrier.sh
      - run: bash scripts/check-rust-layer-boundaries.sh
      - run: cargo test --locked --manifest-path scripts/data-contract-check/Cargo.toml
      - run: python3 scripts/check-sql-contracts.py
      - run: python3 scripts/check-tauri-command-inventory.py

  frontend:
    name: frontend (type-check, lint, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - run: npm ci

      - name: Type-check
        run: npm run type-check

      - name: Generated IPC contract consumers
        run: npm run contracts:check

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test -- --run

      - name: Renderer production build
        run: npx vite build

      - name: Install browsers for smoke tests
        run: npx playwright install --with-deps chromium webkit

      - name: Browser smoke tests
        run: npm run test:e2e

  sync-engine:
    name: api-rust check
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            api-rust/target/
          key: cargo-api-rust-${{ hashFiles('api-rust/Cargo.lock') }}
          restore-keys: cargo-api-rust-
      - name: cargo check
        working-directory: api-rust
        run: cargo check --all-targets
      - name: unit tests
        working-directory: api-rust
        run: cargo test --lib
      - name: PostgreSQL contracts
        working-directory: api-rust
        env:
          DATABASE_URL: postgres://postgres:test-only@localhost:5432/postgres
        run: cargo test --test sync_persistence -- --ignored
      - name: cargo clippy
        working-directory: api-rust
        run: cargo clippy --all-targets
      - name: cargo fmt --check
        working-directory: api-rust
        run: cargo fmt --all -- --check
