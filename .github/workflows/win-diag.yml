# TEMPORARY diagnostic for cargo check (windows-latest) STATUS_ENTRYPOINT_NOT_FOUND.
# Round 2: the CRT theory was disproved, so stop guessing and name the symbol.
name: win-diag
on:
  push:
    branches: [diag/windows-entrypoint]
  workflow_dispatch:

jobs:
  diag:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src-tauri/target/
          key: cargo-windows-latest-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: cargo-windows-latest-

      - name: Placeholders
        shell: bash
        run: |
          mkdir -p dist
          touch src-tauri/binaries/llama-server-x86_64-pc-windows-msvc.exe \
                src-tauri/binaries/llama-server-cpu-x86_64-pc-windows-msvc.exe

      - name: Build the test binary
        working-directory: src-tauri
        run: cargo test --lib --no-run --message-format=json > build.json

      - name: Find the missing export
        shell: pwsh
        working-directory: src-tauri
        run: |
          $exe = (Get-Content build.json | ForEach-Object { $_ | ConvertFrom-Json } |
            Where-Object { $_.reason -eq 'compiler-artifact' -and $_.target.name -eq 'lattice' -and $_.profile.test -eq $true } |
            Select-Object -Last 1).executable
          Write-Host "EXE=$exe"
          $exeDir = Split-Path $exe
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $dumpbin = (Get-ChildItem "$vs\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" | Select-Object -Last 1).FullName

          # Parse `dumpbin /imports` into a map of DLL -> imported symbol names.
          $imports = @{}
          $curr = $null
          foreach ($line in (& $dumpbin /imports $exe)) {
            if ($line -match '^\s{4}(\S+\.dll)\s*$') { $curr = $Matches[1].ToLower(); $imports[$curr] = New-Object System.Collections.Generic.List[string]; continue }
            # Symbol rows look like:  "  <hint> <name>" after the header block.
            if ($curr -and $line -match '^\s+[0-9A-Fa-f]{1,4}\s+([A-Za-z_?@$][^\s]*)\s*$') { $imports[$curr].Add($Matches[1]) }
          }

          $problems = 0
          foreach ($dll in $imports.Keys | Sort-Object) {
            # Same search order the loader uses for these purposes: app dir, then System32.
            $path = if (Test-Path (Join-Path $exeDir $dll)) { Join-Path $exeDir $dll }
                    elseif (Test-Path "C:\Windows\System32\$dll") { "C:\Windows\System32\$dll" }
                    else { $null }
            if (-not $path) { Write-Host "UNRESOLVED DLL: $dll"; $problems++; continue }
            $exports = New-Object 'System.Collections.Generic.HashSet[string]'
            foreach ($line in (& $dumpbin /exports $path)) {
              if ($line -match '^\s+\d+\s+[0-9A-Fa-f]+\s+[0-9A-Fa-f]{8}\s+(\S+)') { [void]$exports.Add($Matches[1]) }
              elseif ($line -match '^\s+\d+\s+[0-9A-Fa-f]+\s+(\S+)\s*$')          { [void]$exports.Add($Matches[1]) }
            }
            if ($exports.Count -eq 0) { Write-Host "note: no exports parsed from $dll (apiset forwarder?)"; continue }
            foreach ($sym in $imports[$dll]) {
              if (-not $exports.Contains($sym)) {
                Write-Host "MISSING: $dll does not export $sym   [resolved: $path]"
                $problems++
              }
            }
          }
          Write-Host "PROBLEM_COUNT=$problems"
          if ($problems -eq 0) {
            Write-Host "All direct imports resolve; the failure is in a TRANSITIVE dependency."
            Write-Host "Direct dependency list for reference:"
            & $dumpbin /dependents $exe
          }
