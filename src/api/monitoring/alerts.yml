# Prometheus alerting rules for Vault

groups:
  - name: application_alerts
    interval: 30s
    rules:
      # High error rate
      - alert: HighErrorRate
        expr: |
          rate(vault_http_requests_total{status_code=~"5.."}[5m]) > 0.05
        for: 5m
        labels:
          severity: critical
          component: backend
        annotations:
          summary: "High error rate detected"
          description: "Error rate is {{ $value | humanize }} requests/sec on {{ $labels.instance }}"
          runbook_url: "https://docs.vault.dev/runbooks/high-error-rate"

      # High request latency
      - alert: HighLatency
        expr: |
          histogram_quantile(0.99,
            rate(vault_http_request_duration_seconds_bucket[5m])
          ) > 5
        for: 5m
        labels:
          severity: warning
          component: backend
        annotations:
          summary: "High request latency detected"
          description: "P99 latency is {{ $value | humanize }}s on {{ $labels.endpoint }}"
          runbook_url: "https://docs.vault.dev/runbooks/high-latency"

      # Too many requests
      - alert: HighRequestRate
        expr: |
          rate(vault_http_requests_total[5m]) > 1000
        for: 10m
        labels:
          severity: warning
          component: backend
        annotations:
          summary: "Unusually high request rate"
          description: "Request rate is {{ $value | humanize }} requests/sec"

      # Application down
      - alert: ApplicationDown
        expr: up{job="vault-backend"} == 0
        for: 1m
        labels:
          severity: critical
          component: backend
        annotations:
          summary: "Vault backend is down"
          description: "Vault backend on {{ $labels.instance }} has been down for more than 1 minute"
          runbook_url: "https://docs.vault.dev/runbooks/application-down"

  - name: database_alerts
    interval: 30s
    rules:
      # Database down
      - alert: DatabaseDown
        expr: up{job="postgresql"} == 0
        for: 1m
        labels:
          severity: critical
          component: database
        annotations:
          summary: "PostgreSQL database is down"
          description: "PostgreSQL on {{ $labels.instance }} is not responding"
          runbook_url: "https://docs.vault.dev/runbooks/database-down"

      # High database query latency
      - alert: HighDatabaseLatency
        expr: |
          histogram_quantile(0.99,
            rate(vault_db_query_duration_seconds_bucket[5m])
          ) > 1
        for: 5m
        labels:
          severity: warning
          component: database
        annotations:
          summary: "High database query latency"
          description: "P99 query latency is {{ $value | humanize }}s for {{ $labels.query_type }}"

      # Too many database connections
      - alert: HighDatabaseConnections
        expr: vault_db_connections_active > 80
        for: 5m
        labels:
          severity: warning
          component: database
        annotations:
          summary: "High number of database connections"
          description: "{{ $value }} active database connections"

      # Database connection errors
      - alert: DatabaseConnectionErrors
        expr: |
          rate(vault_db_connection_errors_total[5m]) > 0.1
        for: 5m
        labels:
          severity: warning
          component: database
        annotations:
          summary: "Database connection errors detected"
          description: "{{ $value | humanize }} connection errors/sec"

  - name: system_alerts
    interval: 30s
    rules:
      # High CPU usage
      - alert: HighCPUUsage
        expr: vault_system_cpu_usage_percent > 85
        for: 10m
        labels:
          severity: warning
          component: system
        annotations:
          summary: "High CPU usage"
          description: "CPU usage is {{ $value | humanize }}%"

      # High memory usage
      - alert: HighMemoryUsage
        expr: |
          (vault_system_memory_usage_bytes /
           (vault_system_memory_usage_bytes + vault_system_memory_available_bytes)) * 100 > 85
        for: 10m
        labels:
          severity: warning
          component: system
        annotations:
          summary: "High memory usage"
          description: "Memory usage is {{ $value | humanize }}%"

      # Critical memory usage
      - alert: CriticalMemoryUsage
        expr: |
          (vault_system_memory_usage_bytes /
           (vault_system_memory_usage_bytes + vault_system_memory_available_bytes)) * 100 > 95
        for: 5m
        labels:
          severity: critical
          component: system
        annotations:
          summary: "Critical memory usage"
          description: "Memory usage is {{ $value | humanize }}% - system may become unstable"
          runbook_url: "https://docs.vault.dev/runbooks/critical-memory"

      # Low disk space
      - alert: LowDiskSpace
        expr: |
          (vault_system_disk_available_bytes /
           (vault_system_disk_usage_bytes + vault_system_disk_available_bytes)) * 100 < 15
        for: 5m
        labels:
          severity: warning
          component: system
        annotations:
          summary: "Low disk space"
          description: "Only {{ $value | humanize }}% disk space remaining on {{ $labels.path }}"

      # Critical disk space
      - alert: CriticalDiskSpace
        expr: |
          (vault_system_disk_available_bytes /
           (vault_system_disk_usage_bytes + vault_system_disk_available_bytes)) * 100 < 5
        for: 1m
        labels:
          severity: critical
          component: system
        annotations:
          summary: "Critical disk space"
          description: "Only {{ $value | humanize }}% disk space remaining on {{ $labels.path }}"
          runbook_url: "https://docs.vault.dev/runbooks/critical-disk-space"

  - name: business_alerts
    interval: 1m
    rules:
      # High indexing failure rate
      - alert: HighIndexingFailureRate
        expr: |
          rate(vault_files_indexing_failed_total[10m]) /
          rate(vault_files_uploaded_total[10m]) > 0.1
        for: 10m
        labels:
          severity: warning
          component: indexing
        annotations:
          summary: "High file indexing failure rate"
          description: "{{ $value | humanizePercentage }} of files are failing to index"

      # OCR failures
      - alert: HighOCRFailureRate
        expr: |
          rate(vault_ocr_operations_total{status="failure"}[10m]) /
          rate(vault_ocr_operations_total[10m]) > 0.2
        for: 10m
        labels:
          severity: warning
          component: ocr
        annotations:
          summary: "High OCR failure rate"
          description: "{{ $value | humanizePercentage }} of OCR operations are failing"

      # Search performance
      - alert: SlowSearchQueries
        expr: |
          histogram_quantile(0.95,
            rate(vault_search_query_duration_seconds_bucket[5m])
          ) > 2
        for: 10m
        labels:
          severity: warning
          component: search
        annotations:
          summary: "Slow search queries"
          description: "P95 search latency is {{ $value | humanize }}s"

  - name: cache_alerts
    interval: 1m
    rules:
      # Low cache hit rate
      - alert: LowCacheHitRate
        expr: |
          rate(vault_cache_hits_total[5m]) /
          (rate(vault_cache_hits_total[5m]) + rate(vault_cache_misses_total[5m])) < 0.5
        for: 10m
        labels:
          severity: info
          component: cache
        annotations:
          summary: "Low cache hit rate"
          description: "Cache hit rate is {{ $value | humanizePercentage }} for {{ $labels.cache_name }}"

  - name: task_alerts
    interval: 1m
    rules:
      # High task failure rate
      - alert: HighTaskFailureRate
        expr: |
          rate(vault_task_execution_total{status="failure"}[10m]) /
          rate(vault_task_execution_total[10m]) > 0.1
        for: 10m
        labels:
          severity: warning
          component: tasks
        annotations:
          summary: "High task failure rate"
          description: "{{ $value | humanizePercentage }} of {{ $labels.task_name }} tasks are failing"

      # Task queue backing up
      - alert: TaskQueueBacklog
        expr: vault_task_queue_length > 1000
        for: 15m
        labels:
          severity: warning
          component: tasks
        annotations:
          summary: "Task queue backlog"
          description: "{{ $value }} tasks queued in {{ $labels.queue_name }}"
