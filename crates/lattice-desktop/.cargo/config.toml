# Cargo configuration for snapshot tests

[alias]
# Snapshot test aliases
snap-test = "test --test indexing_output_test"
snap-review = "insta review"
snap-accept = "insta accept"
snap-reject = "insta reject"
snap-check = "insta test --check"

# Stack size optimization for macOS
# Increases stack size from default 2MB to 8MB to prevent overflow during:
# - ONNX Runtime 2.0 model initialization (heavy ML dependencies)
# - Deep async call chains in tokio worker threads
# - Complex HTML parsing (e.g., Reddit pages) with scraper/html5ever
# - Recursive content extraction algorithms in article extractor
# Note: Using RUST_MIN_STACK environment variable instead of linker flags
# to avoid applying -stack_size to library dependencies

[env]
RUST_MIN_STACK = "33554432"
# Enable SQLx offline mode - use pre-generated query metadata from .sqlx/ directory
# This allows compilation without a database connection
SQLX_OFFLINE = "true"

[target.'cfg(test)']
rustflags = [
    # Allow unwraps in tests
    "-A", "clippy::unwrap_used",
    "-A", "clippy::expect_used",
]

# RUST_MIN_STACK reaches only threads std spawns, Tokio workers included.
# The main thread's stack is set at link time by build_support/main_thread_stack.rs.
