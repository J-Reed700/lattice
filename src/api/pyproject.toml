[tool.poetry]
name = "vault-backend"
version = "0.1.0"
description = "Personal knowledge recall system backend with semantic search and vector embeddings"
authors = ["Vault Team <team@vault.dev>"]
license = "MIT"
readme = "README.md"
packages = [{include = "src"}]
keywords = ["knowledge-management", "search", "embeddings", "fastapi", "vector-database"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Framework :: FastAPI",
    "Framework :: Pydantic",
    "Framework :: Pytest",
]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = ">=0.115.0"
uvicorn = {extras = ["standard"], version = "^0.24.0"}
python-multipart = "^0.0.6"
pydantic = "^2.5.2"
pydantic-settings = "^2.1.0"
sqlalchemy = "^2.0.23"
alembic = "^1.13.0"
asyncpg = "^0.29.0"
psycopg2-binary = "^2.9.9"
pgvector = "^0.4.2"
sentence-transformers = "^2.2.2"
torch = "^2.5.0"
torchvision = "^0.20.0"
transformers = "^4.35.2"
pillow = "^11.3.0"
watchdog = "^3.0.0"
httpx = "0.28.1"
python-dotenv = "^1.0.0"
python-magic = "^0.4.27"
pypdf = "5.9.0"
python-docx = "^1.1.0"
beautifulsoup4 = "^4.12.2"
lxml = "^5.3.0"
celery = "^5.3.4"
redis = "^5.0.1"
structlog = "^23.2.0"
python-dateutil = "^2.8.2"
pytesseract = {version = "^0.3.10", optional = true}
timm = {version = "^0.9.16", optional = true}
rank-bm25 = "^0.2.2"
slowapi = "^0.1.9"
pyotp = "^2.9.0"
qrcode = {extras = ["pil"], version = "^7.4"}
duckduckgo-search = "^7.3.0"
typer = "^0.12.0"
rich = "^13.7.0"
aiofiles = "^24.1.0"
tiktoken = ">=0.5.0"
opentelemetry-api = "^1.21.0"
opentelemetry-sdk = "^1.21.0"
opentelemetry-exporter-otlp = "^1.21.0"
opentelemetry-instrumentation-fastapi = "^0.42b0"
opentelemetry-instrumentation-psycopg2 = "^0.42b0"
opentelemetry-instrumentation-requests = "^0.42b0"
opentelemetry-instrumentation-sqlalchemy = "^0.42b0"
langchain = "^0.2.0"
langchain-ollama = "^0.1.0"
minio = "^7.2.19"
python-jose = {extras = ["cryptography"], version = "^3.5.0"}
email-validator = "^2.3.0"
passlib = {extras = ["bcrypt"], version = "^1.7.4"}
psutil = "^7.1.3"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.3"
pytest-asyncio = "^0.21.1"
pytest-cov = "^4.1.0"
pytest-mock = "^3.12.0"
faker = "^20.1.0"
factory-boy = "^3.3.0"
ruff = "^0.1.6"
mypy = "^1.7.1"
pre-commit = "^3.5.0"
types-python-dateutil = "^2.8.19"
types-redis = "^4.6.0"
ipython = "^8.18.1"
ipdb = "^0.13.13"
watchfiles = "^0.21.0"

[tool.poetry.group.test.dependencies]
pytest = "^7.4.3"
pytest-asyncio = "^0.21.1"
pytest-cov = "^4.1.0"
pytest-mock = "^3.12.0"
faker = "^20.1.0"
factory-boy = "^3.3.0"

[tool.poetry.extras]
ocr = ["pytesseract", "timm"]

[tool.poetry.group.prod.dependencies]
gunicorn = "^21.2.0"
sentry-sdk = {extras = ["fastapi"], version = "^1.38.0"}
orjson = "^3.9.10"
prometheus-client = "^0.19.0"

[tool.poetry.group.docs.dependencies]
mkdocs = "^1.5.3"
mkdocs-material = "^9.5.2"
mkdocstrings = {extras = ["python"], version = "^0.24.0"}

[tool.poetry.scripts]
recall-api = "src.main:main"
recall = "src.cli.main:main"
download-models = "scripts.download_models:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
fix = true
show-fixes = true

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "N",     # pep8-naming
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "C4",    # flake8-comprehensions
    "DTZ",   # flake8-datetimez
    "T10",   # flake8-debugger
    "EM",    # flake8-errmsg
    "ISC",   # flake8-implicit-str-concat
    "ICN",   # flake8-import-conventions
    "PIE",   # flake8-pie
    "PT",    # flake8-pytest-style
    "Q",     # flake8-quotes
    "RSE",   # flake8-raise
    "RET",   # flake8-return
    "SIM",   # flake8-simplify
    "TID",   # flake8-tidy-imports
    "TCH",   # flake8-type-checking
    "ARG",   # flake8-unused-arguments
    "PTH",   # flake8-use-pathlib
    "PL",    # pylint
    "TRY",   # tryceratops
    "RUF",   # ruff-specific rules
]
ignore = [
    "E501",   # line-too-long (handled by formatter)
    "B008",   # do-not-perform-function-call-in-argument-defaults
    "PLR0913", # too-many-arguments
    "PLR2004", # magic-value-comparison
    "TRY003",  # raise-vanilla-args
    "EM101",   # raw-string-in-exception
    "EM102",   # f-string-in-exception
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "F403"]
"tests/**/*.py" = ["S101", "PLR2004", "ARG001", "ARG002"]
"migrations/**/*.py" = ["F401"]

[tool.ruff.lint.isort]
known-first-party = ["src"]
force-sort-within-sections = true

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
strict_concatenate = true
check_untyped_defs = true
disallow_untyped_defs = true
disallow_any_generics = true
disallow_untyped_calls = true
disallow_incomplete_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
show_error_codes = true
show_column_numbers = true
pretty = true
plugins = ["pydantic.mypy", "sqlalchemy.ext.mypy.plugin"]

[[tool.mypy.overrides]]
module = [
    "sentence_transformers.*",
    "watchdog.*",
    "celery.*",
    "transformers.*",
    "torch.*",
    "torchvision.*",
    "magic.*",
    "docx.*",
    "bs4.*",
    "pytesseract.*",
    "timm.*",
    "pyotp.*",
    "qrcode.*",
]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
minversion = "7.0"
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--showlocals",
    "--tb=short",
    "-ra",
    "--cov=src",
    "--cov-branch",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-report=xml",
]
markers = [
    "unit: Unit tests that test individual components",
    "integration: Integration tests that test multiple components together",
    "slow: Slow tests that take more than 1 second",
    "asyncio: Async tests",
]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.coverage.run]
source = ["src"]
branch = true
omit = [
    "*/tests/*",
    "*/migrations/*",
    "*/conftest.py",
    "*/__pycache__/*",
    "*/site-packages/*",
]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
fail_under = 60
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "def __str__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
    "@overload",
]

[tool.coverage.html]
directory = "htmlcov"

[tool.coverage.xml]
output = "coverage.xml"
