version: '3.8'

services:
  # Prometheus - Metrics collection and alerting
  prometheus:
    image: prom/prometheus:latest
    container_name: vault-prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts/alerts.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - vault-monitoring
    restart: unless-stopped
    labels:
      - "monitoring.component=prometheus"

  # Alertmanager - Alert routing and notification
  alertmanager:
    image: prom/alertmanager:latest
    container_name: vault-alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    ports:
      - "9093:9093"
    networks:
      - vault-monitoring
    restart: unless-stopped
    labels:
      - "monitoring.component=alertmanager"

  # Grafana - Metrics visualization
  grafana:
    image: grafana/grafana:latest
    container_name: vault-grafana
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-changeme}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=http://localhost:3000
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
    volumes:
      - ./monitoring/grafana-dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    networks:
      - vault-monitoring
    restart: unless-stopped
    depends_on:
      - prometheus
    labels:
      - "monitoring.component=grafana"

  # Loki - Log aggregation
  loki:
    image: grafana/loki:latest
    container_name: vault-loki
    command: -config.file=/etc/loki/loki.yml
    volumes:
      - ./monitoring/loki.yml:/etc/loki/loki.yml:ro
      - loki-data:/loki
    ports:
      - "3100:3100"
    networks:
      - vault-monitoring
    restart: unless-stopped
    labels:
      - "monitoring.component=loki"

  # Promtail - Log shipper for Loki
  promtail:
    image: grafana/promtail:latest
    container_name: vault-promtail
    command: -config.file=/etc/promtail/promtail.yml
    volumes:
      - ./monitoring/promtail.yml:/etc/promtail/promtail.yml:ro
      - /var/log:/var/log:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    networks:
      - vault-monitoring
    restart: unless-stopped
    depends_on:
      - loki
    labels:
      - "monitoring.component=promtail"

  # Node Exporter - System metrics
  node-exporter:
    image: prom/node-exporter:latest
    container_name: vault-node-exporter
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    ports:
      - "9100:9100"
    networks:
      - vault-monitoring
    restart: unless-stopped
    labels:
      - "monitoring.component=node-exporter"

  # PostgreSQL Exporter - Database metrics
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: vault-postgres-exporter
    environment:
      - DATA_SOURCE_NAME=${POSTGRES_EXPORTER_DSN:-postgresql://vault:vault@postgres:5432/vault?sslmode=disable}
    ports:
      - "9187:9187"
    networks:
      - vault-monitoring
      - vault-backend
    restart: unless-stopped
    depends_on:
      - prometheus
    labels:
      - "monitoring.component=postgres-exporter"

  # Redis Exporter - Cache metrics
  redis-exporter:
    image: oliver006/redis_exporter:latest
    container_name: vault-redis-exporter
    environment:
      - REDIS_ADDR=${REDIS_ADDR:-redis:6379}
    ports:
      - "9121:9121"
    networks:
      - vault-monitoring
      - vault-backend
    restart: unless-stopped
    depends_on:
      - prometheus
    labels:
      - "monitoring.component=redis-exporter"

  # cAdvisor - Container metrics (optional)
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: vault-cadvisor
    privileged: true
    devices:
      - /dev/kmsg:/dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /cgroup:/cgroup:ro
    ports:
      - "8080:8080"
    networks:
      - vault-monitoring
    restart: unless-stopped
    labels:
      - "monitoring.component=cadvisor"

volumes:
  prometheus-data:
    driver: local
  alertmanager-data:
    driver: local
  grafana-data:
    driver: local
  loki-data:
    driver: local

networks:
  vault-monitoring:
    driver: bridge
  vault-backend:
    external: true
    name: vault-backend
