version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg15
    container_name: vault-postgres-dev
    environment:
      POSTGRES_USER: vault
      POSTGRES_PASSWORD: vault
      POSTGRES_DB: vault
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - vault-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vault"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: vault-redis-dev
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - vault-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: vault-minio-dev
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: vault-access-key
      MINIO_ROOT_PASSWORD: change-this-minio-secret-key
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - vault-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 10s

  createbuckets:
    image: minio/mc:latest
    container_name: vault-minio-setup
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - vault-network
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set myminio http://minio:9000 vault-access-key change-this-minio-secret-key;
      /usr/bin/mc mb myminio/vault-files --ignore-existing;
      /usr/bin/mc anonymous set download myminio/vault-files;
      exit 0;
      "

  electric:
    image: electricsql/electric:latest
    container_name: vault-electric-dev
    environment:
      DATABASE_URL: postgresql://electric:electric@postgres:5432/electric
      ELECTRIC_WRITE_TO_PG_MODE: logical_replication
      LOGICAL_PUBLISHER_HOST: postgres
      LOGICAL_PUBLISHER_PORT: 5432
      PG_PROXY_PASSWORD: electric
    ports:
      - "5133:5133"
    networks:
      - vault-network
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  backend:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: vault-backend-dev
    environment:
      DATABASE_URL: postgresql://vault:vault@postgres:5432/vault
      ELECTRIC_URL: http://electric:5133
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: vault-access-key
      MINIO_SECRET_KEY: change-this-minio-secret-key
      MINIO_SECURE: "false"
      MINIO_BUCKET: vault-files
      DEBUG: "true"
      LOG_LEVEL: DEBUG
      ENVIRONMENT: development
      AUTO_RELOAD: "true"
    ports:
      - "8000:8000"
    volumes:
      - ../src:/app/src
      - ../models:/app/models
      - ../alembic:/app/alembic
      - ../migrations:/app/migrations
      - vault_data:/data
    networks:
      - vault-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      createbuckets:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload
    restart: unless-stopped

  celery-worker:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: vault-celery-dev
    environment:
      DATABASE_URL: postgresql://vault:vault@postgres:5432/vault
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: vault-access-key
      MINIO_SECRET_KEY: change-this-minio-secret-key
      MINIO_SECURE: "false"
      MINIO_BUCKET: vault-files
      DEBUG: "true"
      LOG_LEVEL: INFO
    volumes:
      - ../src:/app/src
      - ../models:/app/models
      - vault_data:/data
    networks:
      - vault-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    command: celery -A src.services.celery worker --loglevel=info --concurrency=4
    restart: unless-stopped

networks:
  vault-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local
  vault_data:
    driver: local
