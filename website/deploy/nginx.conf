worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 256; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    server_tokens off;
    sendfile on;
    keepalive_timeout 30;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    gzip on;
    gzip_types text/css text/plain application/javascript application/xml image/svg+xml;

    server {
        listen 8080;
        server_name lattice.lambdaaudio.com;
        root /usr/share/nginx/html;
        index index.html;
        charset utf-8;

        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; font-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'none'" always;
        add_header Cache-Control "public, max-age=300";

        location = /healthz {
            default_type text/plain;
            access_log off;
            return 200 "ok\n";
        }

        location ~ \.sha256$ {
            default_type text/plain;
            add_header X-Content-Type-Options nosniff always;
            add_header Cache-Control "public, max-age=300";
        }

        location ~ \.dmg$ {
            default_type application/x-apple-diskimage;
            add_header Content-Disposition "attachment";
            add_header X-Content-Type-Options nosniff always;
            add_header Cache-Control "public, max-age=3600";
        }

        location ~ \.md$ {
            return 404;
        }

        location / { try_files $uri $uri/ =404; }
    }
}
