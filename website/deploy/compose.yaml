name: lattice-site

services:
  lattice-site:
    image: lattice-site:${LATTICE_SITE_TAG:?Set an immutable release tag}
    build: .
    restart: unless-stopped
    expose:
      - "8080"
    networks:
      - pangolin
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777,noexec,nosuid,nodev
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 64m
    cpus: 0.5
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "2"

networks:
  pangolin:
    external: true
