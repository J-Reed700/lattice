name: CI

# Never merges. Each tests-first commit of the review module runs on its own
# tree: its new and changed tests must fail on their assertions, and every
# other test must pass. The jobs check out those commits by hash, so this
# branch's own tree is never built.
on:
  pull_request:

concurrency:
  group: reds-${{ github.sha }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Named like main's job, with its env, so main's Rust cache is the one restored.
  rust-check:
    name: rust red ${{ matrix.sha }}
    if: false
    runs-on: ubuntu-24.04
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        sha:
          - 886244bfc33b33b56bb98f0f3bf739acde8a2c43
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.sha }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install Linux system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Add swap for the test build
        run: |
          sudo fallocate -l 16G /ci-swapfile
          sudo chmod 600 /ci-swapfile
          sudo mkswap /ci-swapfile
          sudo swapon /ci-swapfile
          free -m

      - uses: Swatinem/rust-cache@v2
        with:
          key: rust-check
          save-if: false

      - name: Core and learning tests on this tree
        run: cargo test --locked -p lattice-core -p lattice-learning --lib --no-fail-fast

  # Every frontend step of main's job on the integration tree, each one run even when one before it fails,
  # so one round shows every problem.
  integration-frontend:
    name: integration frontend ${{ matrix.sha }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        sha:
          - 92b4a5b36cffc47f438611e50fb5edbb7f013758
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - run: npm ci

      - name: Type-check
        continue-on-error: true
        run: npm run type-check

      - name: Type-check browser journeys
        continue-on-error: true
        run: npm run type-check:e2e

      - name: Generated IPC contract consumers
        continue-on-error: true
        run: npm run contracts:check

      - name: Lint
        continue-on-error: true
        run: npm run lint

      - name: Unit tests and enforced coverage floors
        continue-on-error: true
        run: npm run test:coverage

      - name: Renderer production build
        continue-on-error: true
        run: npx vite build

      - name: Initial renderer JavaScript budget
        continue-on-error: true
        run: node scripts/check-initial-js-budget.mjs dist

      - name: Install browsers for smoke tests
        run: npx playwright install --with-deps chromium webkit

      - name: Browser smoke tests
        continue-on-error: true
        run: npm run test:e2e

      - name: Upload browser reports and failure artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-browser-results-${{ matrix.sha }}
          path: |
            e2e-results/html/
            e2e-results/results.json
            e2e-results/artifacts/
          if-no-files-found: warn
          retention-days: 14

  vitest:
    name: vitest reds
    if: false
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: review/full-control
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Each tests-first commit's changed test files on its own tree
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/reds"
          last_lock=""
          while read -r sha files; do
            [ -n "$sha" ] || continue
            git checkout -q --force "$sha"
            lock="$(git rev-parse "$sha:package-lock.json")"
            if [ "$lock" != "$last_lock" ]; then
              npm ci --no-audit --no-fund > "$RUNNER_TEMP/reds/npm-$sha.log" 2>&1 || { echo "npm ci failed at $sha"; tail -40 "$RUNNER_TEMP/reds/npm-$sha.log"; exit 1; }
              last_lock="$lock"
            fi
            echo "::group::red $sha"
            if npx vitest run $files > "$RUNNER_TEMP/reds/$sha.log" 2>&1; then code=0; else code=$?; fi
            cat "$RUNNER_TEMP/reds/$sha.log"
            echo "::endgroup::"
            echo "red $sha exit $code"
          done <<'LIST'
          886244bfc33b33b56bb98f0f3bf739acde8a2c43 src/features/learning/lessons/review/ClaimReviewScreen.editSection.test.tsx src/features/learning/lessons/review/TeachingFindings.actions.test.tsx
          LIST

      - name: Upload each red's vitest log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vitest-reds
          path: ${{ runner.temp }}/reds/
          retention-days: 14
