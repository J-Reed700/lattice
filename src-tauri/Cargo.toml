[package]
name = "lattice-desktop"
version = "1.0.0"
edition = "2021"
license = "MIT"
default-run = "lattice-desktop"

[workspace]
members = ["crates/lattice-core"]
# A path dependency inside the root would otherwise join the workspace.
exclude = ["vendor/readability-js"]

# One pin and one feature set for every crate the core and the app share, so
# a core-only build resolves the same features as the app.
[workspace.dependencies]
anyhow = "1.0"
async-trait = "0.1"
bytemuck = "1.14"
chrono = { version = "0.4", features = ["serde"] }
derive_more = { version = "1.0", features = ["from", "into", "display", "deref"] }
dirs = "5.0"
futures = "0.3"
hex = "0.4"
mockall = "0.13"
objc = "0.2"
once_cell = "1.19"
parking_lot = "0.12"
proptest = "1.5"
# The Public Suffix List compiled into the binary: a source's registrable
# domain is computed with no network lookup (source provenance, §15).
psl = "2.1"
rand = "0.8"
regex = "1.10"
# rustls, not the default native-tls: on macOS native-tls is Secure Transport,
# which cannot negotiate TLS 1.3 or HTTP/2. Sites that require TLS 1.3 failed
# with "bad protocol version" before a request was sent, and every page came
# back over HTTP/1.1, unlike any browser. Native roots keep user-installed CAs.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "http2", "charset", "macos-system-configuration", "stream", "json", "cookies", "gzip", "deflate", "brotli"] }
rust-stemmers = "1.2"
serde = { version = "1.0", features = ["derive"] }
# preserve_order: a JSON schema's properties reach the grammar in the order
# they are written, so a model writes `prompt` before `correctIndex` and a
# finding before its verdict, not alphabetically.
serde_json = { version = "1.0", features = ["preserve_order"] }
sha2 = "0.10"
specta = { version = "=2.0.0-rc.20", features = ["derive", "serde", "chrono", "uuid", "serde_json"] }
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "sqlite", "uuid", "chrono", "macros", "migrate"], default-features = false }
tempfile = "3.8"
thiserror = "1.0"
tokio = { version = "1.35", features = ["full"] }
# CancellationToken for graceful shutdown signaling. Sagas race their
# `recv()` against the token so app-wide shutdown can preempt a pending
# event-bus poll instead of waiting for RecvError::Closed.
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"
unicode-normalization = "0.1"
url = "2.5"
urlencoding = "2.1.3"
uuid = { version = "1.6", features = ["v4", "serde"] }

[workspace.lints.rust]
# Public APIs are not fully documented yet.
missing_docs = "allow"

[workspace.lints.clippy]
# Error handling - prevent panics in production
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"                 # Deny explicit panic!()

# Additional safety lints
unwrap_in_result = "deny"      # Deny unwrap inside Result-returning functions
indexing_slicing = "deny"      # Deny array indexing without bounds check

# Code quality
missing_errors_doc = "allow"

[lints]
workspace = true

[lib]
name = "lattice"
# The documentation contains architectural and usage pseudocode with omitted
# setup (mock repositories, async runtimes, application state). It is not an
# executable doctest corpus; unit and integration targets provide the test gate.
doctest = false

[[bin]]
name = "lattice-desktop"

[[bin]]
name = "export_bindings"
path = "src/bin/export_bindings/main.rs"
required-features = ["bindings-export"]

[build-dependencies]
tauri-build = { version = "2.5", features = [] }
tauri-specta = { version = "2.0.0-rc.14", features = ["derive"] }
# build_support/sidecar_guard.rs: same versions as [dependencies], so the lock
# gains nothing.
serde_json = "1.0"
sha2 = "0.10"

[dependencies]
lattice-core = { path = "crates/lattice-core" }
tauri = { version = "=2.11.1", features = ["protocol-asset"] }
tauri-plugin-wdio-webdriver = { version = "=1.4.0", optional = true }
tauri-plugin-shell = "2.0"
tauri-plugin-dialog = "2.6.0"
# One running app per install: a second launch would reap the first one's
# llama-server and run migrations and sweeps against the same data.
tauri-plugin-single-instance = "2"

# Type-safe IPC code generation
specta = { workspace = true }
specta-typescript = "0.0.7"
tauri-specta = { version = "2.0.0-rc.14", features = ["derive", "typescript"] }

serde = { workspace = true }
serde_json = { workspace = true }
semver = "1.0"
jsonschema = { version = "0.17", default-features = false }
tokio = { workspace = true }
tempfile = { workspace = true }
notify = "6.1"
# Sibling of `notify` (same maintainers) that handles the editor-temp-file-
# swap insanity natively. Without it we'd hand-roll a sweep loop that
# misclassifies macOS FSEvents Any/Other variants and atomic-rename
# sequences. The debouncer batches into clean DebouncedEvent groups
# keyed per-path with backend-tracked metadata.
notify-debouncer-full = "0.3"
sqlx = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
# The reranker and embeddings both use Candle; the chat LLM runs in the
# bundled llama-server sidecar.
# (cross-encoder/ms-marco-MiniLM-L-6-v2). Embeddings already use Candle
# (see features/embedding/candle_service.rs). With this removal Lattice
# ships exactly one tensor framework — Candle — for both embedding and
# reranker inference, with the bundled llama-server sidecar handling
# the chat LLM. ~50MB removed from the binary; no more two-allocator
# split between ORT's C++ runtime and Candle's pure-Rust runtime.
# Drop tokenizers' default features to avoid `esaxx_fast`, which builds esaxx-rs
# with `.static_crt(true)` (/MT). That collides with cxx/usearch using /MD on
# Windows MSVC and the linker fails with LNK1319 "RuntimeLibrary mismatch".
# `esaxx_fast` is a SentencePiece training optimization we don't use — we only
# run pretrained tokenizers for inference.
tokenizers = { version = "0.15", default-features = false, features = ["progressbar", "onig"] }
ndarray = "0.16.1"
anyhow = { workspace = true }
thiserror = { workspace = true }
rayon = "1.10"
memmap2 = "0.9.11"
usearch = "2.23"
lru = "0.18.2"
sha2 = { workspace = true }
futures = { workspace = true }
async-stream = "0.3"
reqwest = { workspace = true }
hex = { workspace = true }
# Learner execution: restricted JavaScript and CPython/WASI guests, behind the
# `learning-labs` feature. Native compiler projects use the optional container
# provider.
rquickjs = { version = "=0.14.0", default-features = false, features = ["std", "loader"], optional = true }
wasmtime = { version = "=48.0.6", default-features = false, features = ["cranelift", "runtime", "std"], optional = true }
wasmtime-wasi = { version = "=48.0.6", default-features = false, features = ["p1"], optional = true }
lopdf = { version = "0.44", default-features = false }
docx-rs = "0.4"
encoding_rs = "0.8"
zip = "9"
unicode-segmentation = "1.10"
urlencoding = { workspace = true }  # URL decoding for path validation (CWE-22)
dirs = { workspace = true }
opener = "0.7"
md5 = "0.7"
# Native persistent stores must be explicitly enabled; keyring otherwise uses a mock.
keyring = { version = "3.6", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
infer = "0.15"
# Header-only width/height of a fetched chat picture (no decoding), for the
# decode-bomb bound in features/web/images.
imagesize = "0.13"
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt"] }
tracing-appender = "0.2"
opentelemetry = "0.32"
opentelemetry-otlp = { version = "0.32", features = ["grpc-tonic"] }
opentelemetry_sdk = { version = "0.32", features = ["rt-tokio"] }
tracing-opentelemetry = "0.33"
once_cell = { workspace = true }
regex = { workspace = true }
lazy-regex = "3"
rust-stemmers = { workspace = true }
async-trait = { workspace = true }
ollama-rs = "0.2"
tokio-stream = "0.1"
tokio-util = { workspace = true }
# fastembed removed: see ORT note above.
# Candle — pure-Rust ML framework for embedding model inference.
# CPU baseline here; the `metal` feature is enabled in the macOS-only
# target stanza below. Enabling `metal` on Windows/Linux pulls in
# objc2-foundation/objc2-metal, which fail to compile off Apple targets.
# Pinned to 0.10.2. 0.10.x adds qwen3, qwen3_moe, qwen3_vl, and
# nomic_bert which 0.8/0.9 lack. 0.10.2 is on crates.io but lacks a
# matching Git tag; this is a known upstream quirk.
candle-core = "=0.10.2"
candle-nn = "=0.10.2"
candle-transformers = "=0.10.2"
safetensors = "0.4"
# Rust modernization dependencies
parking_lot = { workspace = true }
fs4 = "0.8"
rand = { workspace = true }
fsrs = "=6.6.2"

# LLM and web ingestion dependencies
sysinfo = "0.30"
scraper = "0.18"
url = { workspace = true }
html5ever = "0.26"
ego-tree = "0.6"
select = "0.6"
lol_html = "3"
# Keep the reader and learner engine on one native QuickJS ABI. The vendored
# upstream wrapper is unchanged except for its rquickjs dependency; see README.
readability-js = { path = "vendor/readability-js" }

# Audio ingest. Symphonia decodes the container and codec; Rubato
# resamples to the 16 kHz mono f32 whisper expects. default-features = false
# drops mkv/adpcm we do not need; `ogg` is the container for `vorbis` and
# `pcm` is the codec for `wav`, so both must be listed explicitly.
symphonia = { version = "=0.5.5", default-features = false, features = [
    "mp3", "aac", "isomp4", "flac", "ogg", "vorbis", "wav", "pcm",
] }
rubato = "=0.15.0"

# HDBSCAN over per-document embeddings for `features/corpus_shape`.
petal-clustering = "0.12"
petal-neighbors = "0.13"
chacha20poly1305 = "0.11"
aead-stream = "0.6"
argon2 = "0.6"
hkdf = "0.13"
# `hkdf` 0.13 is on the `digest` 0.11 track, which the root `sha2 = "0.10"`
# (digest 0.10, used by the rest of the app) does not satisfy. The backup
# archive crypto imports this renamed copy; nothing else should.
sha2_v011 = { package = "sha2", version = "0.11" }
zeroize = "1.9"
bip39 = "2.2"
tar = "0.4"
zstd = "0.14"
walkdir = "2.5"
ignore = "0.4"
base64 = "0.23"

# Platform-specific Metal GPU support for macOS (M-series chips).
# Cargo unifies feature flags across the dep graph, so re-declaring
# candle-* here with `metal` enables the feature on macOS without
# affecting Windows/Linux builds (which would fail compiling objc2-*).
# Candle runs embedding and reranker inference. Local LLM inference is
# handled by the bundled `llama-server`
# sidecar (see binaries/, scripts/fetch-llama-binaries.sh, and the
# llama-build.yml CI workflow) — no Rust-side LLM crate is needed.
[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
candle-core = { version = "=0.10.2", features = ["metal"] }
candle-nn = { version = "=0.10.2", features = ["metal"] }
candle-transformers = { version = "=0.10.2", features = ["metal"] }

[target.'cfg(target_os = "macos")'.dependencies]
# Installs the renderer shutdown hook (infrastructure/setup/renderer_shutdown_macos.rs).
objc = { workspace = true }
# OCR page rendering (features/ocr/render). CoreGraphics rasterizes every PDF
# image codec a scan can use (CCITT, JBIG2, JPX), which no pure-Rust crate in
# the tree does; both bindings and `png` were already in Cargo.lock.
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFURL", "CFCGTypes"] }
objc2-core-graphics = { version = "0.3.2", default-features = false, features = [
    "std", "CGAffineTransform", "CGBitmapContext", "CGColorSpace", "CGContext",
    "CGImage", "CGPDFDocument", "CGPDFPage",
] }
png = "0.18"


[target.'cfg(windows)'.dependencies]
windows = { version = "0.52", features = [
    "Win32_Storage_FileSystem",
    "Win32_Foundation",
    # Job Objects provide cascading sidecar termination.
    # Without this, a hard-killed Lattice main process leaves
    # orphaned llama-server children running. The Job Object kernel
    # primitive guarantees they die with us — even on segfault.
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }
winreg = "0.52"

[dev-dependencies]
lattice-core = { path = "crates/lattice-core", features = ["test-support"] }
criterion = { version = "0.5", features = ["html_reports"] }
proptest = { workspace = true }
insta = { version = "1.45", features = ["json", "redactions"] }
mockall = { workspace = true }
rand = { workspace = true }
futures = { workspace = true }
mockito = "1.0"
wiremock = "0.6"
hound = "=3.5.1"   # generates WAV fixtures for the audio-decode unit tests
tokio = { workspace = true, features = ["test-util"] }   # paused clocks for the stream-timeout tests


[features]
default = ["custom-protocol", "learning-labs"]
custom-protocol = ["tauri/custom-protocol"]
# Built-in JavaScript and Python labs. The engines run only in the lab runner,
# a child process of the app; without them practical runs report the runtimes
# unavailable.
learning-labs = ["dep:rquickjs", "dep:wasmtime", "dep:wasmtime-wasi"]

test-utils = []   # Testing utilities and mocks
desktop-e2e = ["dep:tauri-plugin-wdio-webdriver"] # Explicitly instrumented test bundles only
bindings-export = [] # Developer-only TypeScript binding generator; never ship it in app bundles

# Profile configurations for stack size optimization
# Increases stack size to prevent overflow with heavy ML dependencies (ONNX, candle)
# and complex HTML parsing (e.g., Reddit pages)
[profile.dev]
# Increase stack size to 8MB for development (default is ~2MB)
# This prevents stack overflow during:
# - ONNX Runtime model initialization
# - Deep async call chains in tokio workers
# - Complex HTML parsing with scraper/html5ever
# - Recursive content extraction algorithms
split-debuginfo = "unpacked"

# Model downloads and embedding-generation identities stream SHA-256 over
# multi-gigabyte artifacts. Leaving the hashing crate unoptimized makes a
# 1.1 GB Qwen checkpoint take ~45 seconds to verify in `tauri dev`, while the
# same work is hardware-speed in release builds.
[profile.dev.package.sha2]
opt-level = 3

# Local embedding, reranking, and BPE tokenization run on every chat turn.
# Unoptimized tensor kernels and tokenizer loops run 10-50x slower in `tauri dev`.
[profile.dev.package.candle-core]
opt-level = 3

[profile.dev.package.candle-nn]
opt-level = 3

[profile.dev.package.candle-transformers]
opt-level = 3

[profile.dev.package.tokenizers]
opt-level = 3

[profile.release]
# Production optimizations with 8MB stack
# LTO improves binary size and performance
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[profile.test]
# Test profile - includes dev dependencies and cfg(test) code
# This profile is used for `cargo test`
inherits = "dev"
