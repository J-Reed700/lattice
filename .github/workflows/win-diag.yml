# TEMPORARY diagnostic for cargo check (windows-latest) STATUS_ENTRYPOINT_NOT_FOUND.
# Round 3: round 2's export parser mishandled forwarders, so its output was
# noise. Ask the loader directly (loader snaps under cdb), and redo the symbol
# analysis with forwarders parsed correctly as a backup.
name: win-diag
on:
  push:
    branches: [diag/windows-entrypoint]
  workflow_dispatch:

jobs:
  diag:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src-tauri/target/
          key: cargo-windows-latest-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: cargo-windows-latest-

      - name: Placeholders
        shell: bash
        run: |
          mkdir -p dist
          touch src-tauri/binaries/llama-server-x86_64-pc-windows-msvc.exe \
                src-tauri/binaries/llama-server-cpu-x86_64-pc-windows-msvc.exe

      - name: Build the test binary
        working-directory: src-tauri
        run: cargo test --lib --no-run --message-format=json > build.json

      - name: Record the exe path
        id: exe
        shell: pwsh
        working-directory: src-tauri
        run: |
          $exe = (Get-Content build.json | ForEach-Object { $_ | ConvertFrom-Json } |
            Where-Object { $_.reason -eq 'compiler-artifact' -and $_.target.name -eq 'lattice' -and $_.profile.test -eq $true } |
            Select-Object -Last 1).executable
          Write-Host "EXE=$exe"
          "exe=$exe" >> $env:GITHUB_OUTPUT

      - name: Ask the loader (cdb + loader snaps)
        shell: pwsh
        continue-on-error: true
        run: |
          $cdb = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\Debuggers\x64\cdb.exe" -ErrorAction SilentlyContinue
          if (-not $cdb) { $cdb = Get-ChildItem "C:\Program Files*\Windows Kits\**\Debuggers\x64\cdb.exe" -ErrorAction SilentlyContinue | Select-Object -First 1 }
          if (-not $cdb) { Write-Host "NO_CDB: Debugging Tools not on this image"; exit 0 }
          Write-Host "CDB=$($cdb.FullName)"
          # sxe ld prints each module load; the last one before the bail is the culprit's
          # neighbourhood, and the loader's own error text names the missing procedure.
          $out = & $cdb.FullName -c "sxe ld;g;!dlls -l;q" "${{ steps.exe.outputs.exe }}" "--list" 2>&1
          $out | Select-String -Pattern "procedure entry point|entry point|ERROR_|c0000139|Unable to load|LdrpProcessWork|snap|could not be located" -Context 2,2 |
            ForEach-Object { Write-Host $_ }
          Write-Host "---- last 60 lines of cdb output ----"
          $out | Select-Object -Last 60 | ForEach-Object { Write-Host $_ }

      - name: Symbol analysis with forwarders handled
        shell: pwsh
        continue-on-error: true
        run: |
          $exe = "${{ steps.exe.outputs.exe }}"
          $exeDir = Split-Path $exe
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $dumpbin = (Get-ChildItem "$vs\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" | Select-Object -Last 1).FullName

          function Get-Exports($path) {
            $set = New-Object 'System.Collections.Generic.HashSet[string]'
            foreach ($l in (& $dumpbin /exports $path)) {
              # "  ord hint RVA name" or, for a forwarder, "  ord hint      name (forwarded to x.y)"
              if ($l -match '^\s+\d+\s+[0-9A-Fa-f]+\s+(?:[0-9A-Fa-f]{8}\s+)?([^\s(]+)') { [void]$set.Add($Matches[1]) }
            }
            return $set
          }
          function Get-Imports($path) {
            $map = @{}; $curr = $null
            foreach ($l in (& $dumpbin /imports $path)) {
              if ($l -match '^\s{4}(\S+\.dll)\s*$') { $curr = $Matches[1]; $map[$curr] = New-Object 'System.Collections.Generic.List[string]'; continue }
              if ($curr -and $l -match '^\s+[0-9A-Fa-f]{1,4}\s+([A-Za-z_?@$][^\s]*)\s*$') { $map[$curr].Add($Matches[1]) }
            }
            return $map
          }
          function Resolve-Dll($name) {
            if ($name -like 'api-ms-*' -or $name -like 'ext-ms-*') { return $null }  # apisets: schema-resolved
            foreach ($c in (Join-Path $exeDir $name), "C:\Windows\System32\$name") { if (Test-Path $c) { return $c } }
            return 'MISSING_FILE'
          }

          $seen = New-Object 'System.Collections.Generic.HashSet[string]'
          $queue = New-Object 'System.Collections.Generic.Queue[string]'
          $queue.Enqueue($exe); [void]$seen.Add((Split-Path $exe -Leaf).ToLower())
          $problems = 0
          while ($queue.Count -gt 0) {
            $mod = $queue.Dequeue()
            foreach ($dll in (Get-Imports $mod).Keys) {
              $path = Resolve-Dll $dll
              if ($null -eq $path) { continue }
              if ($path -eq 'MISSING_FILE') { Write-Host "MISSING FILE: $dll (imported by $(Split-Path $mod -Leaf))"; $problems++; continue }
              $exports = Get-Exports $path
              foreach ($sym in (Get-Imports $mod)[$dll]) {
                if (-not $exports.Contains($sym)) {
                  Write-Host "MISSING EXPORT: $dll!$sym  (imported by $(Split-Path $mod -Leaf))  [$path]"
                  $problems++
                }
              }
              if ($seen.Add($dll.ToLower())) { $queue.Enqueue($path) }
            }
          }
          Write-Host "PROBLEM_COUNT=$problems"
          Write-Host "MODULES_SCANNED=$($seen.Count)"
