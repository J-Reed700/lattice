name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: reds-${{ github.sha }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # LunarG no longer serves 1.3.290.0. Keep both Windows checks on the
  # same available runtime, including the path used after extraction.
  # sidecar-binaries.yml pins the same version.
  VULKAN_RUNTIME_VERSION: 1.4.363.0

jobs:
  rust-check:
    name: lattice-desktop lib test executable
    runs-on: windows-latest
    env:
      LATTICE_ALLOW_UNPINNED_SIDECAR: '0'
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      # The test executable compiles in CARGO_MANIFEST_DIR, so the tree must
      # sit at the path it has on the owner's PC.
      - name: Copy the checkout to the owner's path
        shell: pwsh
        run: |
          $dest = 'C:\Code\lattice-wt\drills-port'
          New-Item -ItemType Directory -Force -Path (Split-Path $dest -Parent) | Out-Null
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          robocopy $env:GITHUB_WORKSPACE $dest /E /NFL /NDL /NJH /NJS /NP
          if ($LASTEXITCODE -ge 8) { throw "robocopy failed with exit code $LASTEXITCODE" }
          $global:LASTEXITCODE = 0

      - uses: Swatinem/rust-cache@v2
        with:
          key: rust-check
          save-if: false
          cache-on-failure: true

      - name: Create build placeholders for source checks
        working-directory: C:\Code\lattice-wt\drills-port
        shell: bash
        run: |
          mkdir -p dist
          touch crates/lattice-desktop/binaries/llama-server-x86_64-pc-windows-msvc.exe \
                crates/lattice-desktop/binaries/llama-server-cpu-x86_64-pc-windows-msvc.exe

      - name: Build the lattice-desktop lib test executable
        working-directory: C:\Code\lattice-wt\drills-port\crates\lattice-desktop
        shell: pwsh
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}\target
        run: |
          # Keep the JSON in a file: piping it straight into ConvertFrom-Json
          # eats the compiler diagnostics, which live on the same stream.
          $json = Join-Path $env:RUNNER_TEMP 'testbuild.json'
          cargo test --locked --workspace --features lattice-desktop/bindings-export --lib --bins --tests --no-run --message-format=json -j 2 > $json
          if ($LASTEXITCODE -ne 0) {
            Get-Content $json | ForEach-Object {
              $m = $null; try { $m = $_ | ConvertFrom-Json } catch { }
              if ($m -and $m.reason -eq 'compiler-message' -and $m.message.rendered) { Write-Host $m.message.rendered }
            }
            throw "building the test executables failed (diagnostics above)"
          }
          $libs = @(Get-Content $json | ForEach-Object {
                    $m = $null; try { $m = $_ | ConvertFrom-Json } catch { }
                    if ($m -and $m.executable -and $m.profile.test -eq $true -and $m.target.kind -contains 'lib' -and $m.target.name -eq 'lattice' -and $m.package_id -match 'crates[/\\]lattice-desktop') { $m.executable }
                  })
          if ($libs.Count -ne 1) { throw "expected exactly one lattice lib test executable of lattice-desktop, found $($libs.Count)" }
          $exe = $libs[0]
          Write-Host "lib test executable: $exe"
          $needle = 'C:\Code\lattice-wt\drills-port\crates\lattice-desktop'
          if (-not (Select-String -Path $exe -SimpleMatch $needle -Quiet)) {
            throw "$exe does not contain the compiled-in path $needle"
          }
          Write-Host "compiled-in fixture path found in $exe"
          Set-Content -Path (Join-Path $env:RUNNER_TEMP 'lib-test-exe.txt') -Value $exe -NoNewline

      - name: Stage the executable and DLLs
        shell: pwsh
        run: |
          $exe = Get-Content -Raw (Join-Path $env:RUNNER_TEMP 'lib-test-exe.txt')
          $target = Join-Path $env:GITHUB_WORKSPACE 'target\debug'
          $stage = Join-Path $env:RUNNER_TEMP 'drills-test-exe'
          $deps = Join-Path $stage 'debug\deps'
          New-Item -ItemType Directory -Force -Path $deps | Out-Null
          Copy-Item $exe $deps
          Get-ChildItem (Join-Path $target 'deps') -Filter *.dll | Copy-Item -Destination $deps
          Get-ChildItem $target -Filter *.dll | Copy-Item -Destination (Join-Path $stage 'debug')
          Get-ChildItem $stage -Recurse -File |
            Select-Object @{n='Path';e={$_.FullName.Substring($stage.Length)}}, Length |
            Format-Table -AutoSize | Out-String -Width 300 | Write-Host

      - uses: actions/upload-artifact@v4
        with:
          name: drills-test-exe
          path: ${{ runner.temp }}/drills-test-exe/
          retention-days: 7
          if-no-files-found: error
