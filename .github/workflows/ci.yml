name: CI

# Never merges. Writes the TypeScript bindings of #386's head, so the commit
# that brings them up to date carries the generator's own output. Named like
# main's job, with its env, so main's Rust cache is the one restored.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: reds-${{ github.sha }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  rust-check:
    name: write bindings ${{ matrix.sha }}
    runs-on: ubuntu-24.04
    env:
      LATTICE_ALLOW_UNPINNED_SIDECAR: '0'
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    strategy:
      matrix:
        sha:
          - 10feafbd7051a65244a9e48f02213766dcacbbd7
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.sha }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install Linux system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Add swap for the build
        run: |
          sudo fallocate -l 16G /ci-swapfile
          sudo chmod 600 /ci-swapfile
          sudo mkswap /ci-swapfile
          sudo swapon /ci-swapfile

      - uses: Swatinem/rust-cache@v2
        with:
          key: rust-check
          save-if: false

      - name: Create build placeholders
        run: |
          mkdir -p dist
          touch crates/lattice-desktop/binaries/llama-server-x86_64-unknown-linux-gnu \
                crates/lattice-desktop/binaries/llama-server-cpu-x86_64-unknown-linux-gnu

      - name: Build the generator
        working-directory: crates/lattice-desktop
        run: cargo build --locked --workspace --features lattice-desktop/bindings-export --bin export_bindings

      - name: Write the bindings
        working-directory: crates/lattice-desktop
        run: ../../target/debug/export_bindings

      - name: What the generator changed
        run: git diff --stat -- src/lib/bindings.ts src/shared/ipc/routes.generated.ts

      - uses: actions/upload-artifact@v4
        with:
          name: bindings-${{ matrix.sha }}
          path: |
            src/lib/bindings.ts
            src/shared/ipc/routes.generated.ts
          if-no-files-found: error
