[package]
name = "lattice-core"
version = "1.0.0"
edition = "2021"
license = "MIT"
publish = false

[lints]
workspace = true

[lib]
name = "lattice_core"
# Documentation examples are usage pseudocode with omitted setup, not an
# executable doctest corpus; unit tests provide the test gate.
doctest = false

[dependencies]
anyhow = { workspace = true }
async-trait = { workspace = true }
bytemuck = { workspace = true }
chrono = { workspace = true }
derive_more = { workspace = true }
dirs = { workspace = true }
futures = { workspace = true }
hex = { workspace = true }
mockall = { workspace = true, optional = true }
once_cell = { workspace = true }
parking_lot = { workspace = true }
psl = { workspace = true }
rand = { workspace = true }
regex = { workspace = true }
reqwest = { workspace = true }
rust-stemmers = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
specta = { workspace = true }
sqlx = { workspace = true }
thiserror = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, optional = true }
unicode-normalization = { workspace = true }
unicode-segmentation = "1.10"
url = { workspace = true }
urlencoding = { workspace = true }
uuid = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
# Drains the Objective-C objects Candle's Metal dispatches autorelease
# (see shared/runtime/autorelease.rs). Already in the tree through `metal`.
objc = { workspace = true }

[target.'cfg(unix)'.dependencies]
# Parent-death binding for child processes (shared/process).
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# Power requests keep the PC awake while user work runs (shared/runtime/user_activity.rs).
# Same version as lattice-desktop, so Cargo builds one copy.
windows = { version = "0.52", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Diagnostics_ToolHelp", "Win32_System_JobObjects", "Win32_System_Power", "Win32_System_Threading"] }

[dev-dependencies]
bytes = "1"
h2 = "0.4"
http = "1"
mockall = { workspace = true }
proptest = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
tracing-subscriber = { workspace = true }

[features]
# Test doubles and helpers for the other crates' tests. Enabled only through
# their dev-dependencies, so release builds never compile them.
test-support = ["dep:mockall", "dep:tracing-subscriber"]
