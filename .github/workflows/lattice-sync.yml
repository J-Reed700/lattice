name: lattice-sync

# lattice-sync has no caller in the desktop app, so its checks run only when it
# (or this workflow) changes, or by hand.
on:
  pull_request:
    paths:
      - 'crates/lattice-sync/**'
      - '.github/workflows/lattice-sync.yml'
  push:
    branches: [main]
    paths:
      - 'crates/lattice-sync/**'
      - '.github/workflows/lattice-sync.yml'
  workflow_dispatch:

concurrency:
  group: lattice-sync-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  dependency-audit:
    name: API advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: API advisories
        working-directory: crates/lattice-sync
        run: cargo audit

  sync-engine:
    name: lattice-sync check
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            crates/lattice-sync/target/
          key: cargo-lattice-sync-${{ hashFiles('crates/lattice-sync/Cargo.lock') }}
          restore-keys: cargo-lattice-sync-
      - name: cargo check
        working-directory: crates/lattice-sync
        run: cargo check --all-targets
      - name: unit tests
        working-directory: crates/lattice-sync
        run: cargo test --lib
      - name: PostgreSQL contracts
        working-directory: crates/lattice-sync
        env:
          DATABASE_URL: postgres://postgres:test-only@localhost:5432/postgres
        run: cargo test --test sync_persistence -- --ignored
      - name: cargo clippy
        working-directory: crates/lattice-sync
        run: cargo clippy --all-targets
      - name: cargo fmt --check
        working-directory: crates/lattice-sync
        run: cargo fmt --all -- --check
