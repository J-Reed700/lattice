name: CI

# Never merges. The tests-first commit's new reader test must fail on its
# assertion while the guard and the existing reader tests pass.
on:
  pull_request:

concurrency:
  group: mic-reds-${{ github.sha }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Named like main's job, with its env, so main's Rust cache is the one restored.
  rust-check:
    runs-on: ubuntu-24.04
    env:
      LATTICE_ALLOW_UNPINNED_SIDECAR: '0'
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@v4
        with:
          ref: d913f7663aa5a9b58d7b73881be1282d64bf4a1a

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Add swap for the test build
        run: |
          sudo fallocate -l 16G /ci-swapfile
          sudo chmod 600 /ci-swapfile
          sudo mkswap /ci-swapfile
          sudo swapon /ci-swapfile
          free -m

      - uses: Swatinem/rust-cache@v2
        with:
          key: rust-check
          save-if: false

      - name: Create build placeholders for source checks
        run: |
          mkdir -p dist
          touch crates/lattice-desktop/binaries/llama-server-x86_64-unknown-linux-gnu \
                crates/lattice-desktop/binaries/llama-server-cpu-x86_64-unknown-linux-gnu

      - name: The page reader's tests on the tests-first tree
        working-directory: crates/lattice-desktop
        run: |
          cargo test --locked -p lattice-desktop --features bindings-export --lib --no-fail-fast -- browser_reader::tests::
