# Promtail configuration for log aggregation with Loki

server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # Vault Backend logs
  - job_name: vault-backend
    static_configs:
      - targets:
          - localhost
        labels:
          job: vault-backend
          service: backend
          __path__: /var/log/recall/api/*.log

    pipeline_stages:
      # Parse JSON logs
      - json:
          expressions:
            timestamp: timestamp
            level: level
            event: event
            logger: logger_name
            request_id: request_id
            method: method
            path: path
            status_code: status_code
            duration: duration

      # Extract timestamp
      - timestamp:
          source: timestamp
          format: RFC3339

      # Set log level
      - labels:
          level:
          event:
          logger:
          request_id:

      # Drop debug logs in production (optional)
      # - match:
      #     selector: '{level="debug"}'
      #     action: drop

  # System logs
  - job_name: system
    static_configs:
      - targets:
          - localhost
        labels:
          job: system
          __path__: /var/log/syslog

  # Docker container logs (if using Docker)
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s

    relabel_configs:
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: 'container'
      - source_labels: ['__meta_docker_container_log_stream']
        target_label: 'logstream'
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        target_label: 'service'
