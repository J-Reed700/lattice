name: CI

# Never merges. Each tests-first commit of the review module runs on its own
# tree: its new and changed tests must fail on their assertions, and every
# other test must pass. The jobs check out those commits by hash, so this
# branch's own tree is never built.
on:
  pull_request:

concurrency:
  group: reds-${{ github.sha }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Named like main's job, with its env, so main's Rust cache is the one restored.
  rust-check:
    name: rust red ${{ matrix.sha }}
    runs-on: ubuntu-24.04
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        sha:
          - 4d936a6c5abef0f1b26950f5645d5bb8a8f90d32
          - e0fe15af51a02e6c00c407de19982f4a79836aca
          - dc7c27f58030efce1952a906b55e26bf9125bd8a
          - e1b1d0cf226f8698b86876d3f724251553138da6
          - 609d0b6eaea69e51ed777bf4dc17d6b4515df00d
          - e50e055c1378e7094e13ae516dd46f56baef8f6f
          - ae18b4b9680ad984483c5fa6da27d036552efc4a
          - 93261898076363e0e24d5cbc028c41aab09cc671
          - 1aab92ac3ca3271ec98c54d1af5fd73d7af3aa70
          - b47078081464958dc5cf1957d5aad7edda410c8e
          - 044ee8d0962e2a1b1a03943a32216d928798b3d2
          - cf6fee58cf4f6328c377bfa3da4639b33c99a726
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.sha }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install Linux system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Add swap for the test build
        run: |
          sudo fallocate -l 16G /ci-swapfile
          sudo chmod 600 /ci-swapfile
          sudo mkswap /ci-swapfile
          sudo swapon /ci-swapfile
          free -m

      - uses: Swatinem/rust-cache@v2
        with:
          key: rust-check
          save-if: false

      - name: Core and learning tests on this tree
        run: cargo test --locked -p lattice-core -p lattice-learning --lib --no-fail-fast

  vitest:
    name: vitest reds
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: review/full-control
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Each tests-first commit's changed test files on its own tree
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/reds"
          last_lock=""
          while read -r sha files; do
            [ -n "$sha" ] || continue
            git checkout -q --force "$sha"
            lock="$(git rev-parse "$sha:package-lock.json")"
            if [ "$lock" != "$last_lock" ]; then
              npm ci --no-audit --no-fund > "$RUNNER_TEMP/reds/npm-$sha.log" 2>&1 || { echo "npm ci failed at $sha"; tail -40 "$RUNNER_TEMP/reds/npm-$sha.log"; exit 1; }
              last_lock="$lock"
            fi
            echo "::group::red $sha"
            if npx vitest run $files > "$RUNNER_TEMP/reds/$sha.log" 2>&1; then code=0; else code=$?; fi
            cat "$RUNNER_TEMP/reds/$sha.log"
            echo "::endgroup::"
            echo "red $sha exit $code"
          done <<'LIST'
          1396f6a856b2d763ecb48d8d63c5f44e6dabdda7 src/features/learning/lessons/review/SelectionBar.test.tsx src/features/learning/lessons/review/useReviewSelection.test.tsx
          795ef4d14d446795ce416f28cacada902f7af6f0 src/features/learning/lessons/review/ClaimQueue.selection.test.tsx src/features/learning/lessons/review/ClaimReviewScreen.bulk.test.tsx
          f1a08655d0a0d08a6b831681760fb565ba14ca34 src/features/learning/lessons/review/ClaimQueue.test.tsx src/features/learning/lessons/review/ClaimReviewScreen.teaching.test.tsx src/features/learning/lessons/review/ClaimReviewScreen.test.tsx src/features/learning/lessons/review/TeachingFindings.test.tsx src/features/learning/lessons/review/claimReviewCopy.test.ts
          dc7c27f58030efce1952a906b55e26bf9125bd8a src/features/learning/lessons/review/TeachingFindings.test.tsx
          609d0b6eaea69e51ed777bf4dc17d6b4515df00d src/features/learning/lessons/review/ClaimReviewScreen.noteActions.test.tsx src/features/learning/lessons/review/TeachingFindings.actions.test.tsx src/features/learning/lessons/review/TeachingFindings.test.tsx src/features/learning/lessons/review/claimReviewCopy.test.ts
          e50e055c1378e7094e13ae516dd46f56baef8f6f src/features/learning/lessons/review/ClaimReviewScreen.noteActions.test.tsx src/features/learning/lessons/review/TeachingFindings.actions.test.tsx
          bbcbf20ff0aac0bfeb0a169fd45e0f232f0e78c6 src/features/learning/lessons/review/ClaimReviewScreen.noteActions.test.tsx
          93261898076363e0e24d5cbc028c41aab09cc671 src/features/learning/lessons/review/ClaimReviewScreen.restore.test.tsx
          5c7bc5b339049bbeb6e2f423234a439a6bd9eb78 src/features/learning/lessons/review/ClaimReviewScreen.restore.test.tsx
          044ee8d0962e2a1b1a03943a32216d928798b3d2 src/features/learning/lessons/LessonCard.edit.test.tsx src/features/learning/lessons/edit/LessonSectionEditor.test.tsx src/features/learning/lessons/review/ClaimReviewScreen.editSection.test.tsx src/features/learning/lessons/review/TeachingFindings.test.tsx
          cf6fee58cf4f6328c377bfa3da4639b33c99a726 src/features/learning/lessons/LessonCard.edit.test.tsx
          LIST

      - name: Upload each red's vitest log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vitest-reds
          path: ${{ runner.temp }}/reds/
          retention-days: 14
