name: Build llama-server sidecar binaries

# Compiles llama.cpp's `llama-server` for every platform Lattice ships and,
# on a `llama/*` tag, publishes the binaries as an immutable GitHub Release.
# The app build downloads them with src-tauri/scripts/fetch-llama-binaries.sh.
#
# Everything is driven by src-tauri/scripts/llama-server.lock:
#   llama_cpp_tag  upstream tag to compile
#   release        release tag to publish (must equal the pushed tag)
#   macos_min      deployment target for the macOS binary
#   glibc_max      newest glibc the Linux binaries may require
#
# Every binary must be a single self-contained file: Tauri bundles exactly one
# file per sidecar, so anything it links dynamically must already exist on a
# stock user machine. A 2026 release shipped a macOS binary that linked the CI
# runner's build directory and Homebrew OpenSSL; its `--help` smoke test passed
# only because those files existed on the runner. Hence:
#   * static llama/ggml, static C++ runtime, no OpenMP, no OpenSSL, no curl;
#   * portable x86 baseline (GGML_NATIVE=OFF) instead of the runner's CPU;
#   * verify_llama_binaries.py checks every dynamic dependency, rpath and
#     minimum OS, then runs the binary from a clean directory after the build
#     tree is deleted;
#   * releases are never overwritten, so a published tag always means the same
#     bytes, and the lock pins those bytes by SHA-256.
#
# Bump procedure: src-tauri/binaries/README.md.

on:
  # Build and verify without publishing (use this to try a new llama.cpp tag).
  workflow_dispatch:
  # Exercise the pipeline whenever it changes.
  pull_request:
    paths:
      - .github/workflows/llama-build.yml
      - src-tauri/scripts/llama-server.lock
      - src-tauri/scripts/verify_llama_binaries.py
  # Build, verify and publish.
  push:
    tags:
      - 'llama/**'

permissions:
  contents: read

concurrency:
  group: llama-build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  LOCK: src-tauri/scripts/llama-server.lock
  VERIFY: src-tauri/scripts/verify_llama_binaries.py
  VULKAN_SDK_VERSION: 1.3.290.0

jobs:
  pin:
    name: Read pin
    runs-on: ubuntu-latest
    outputs:
      llama_cpp_tag: ${{ steps.lock.outputs.llama_cpp_tag }}
      release: ${{ steps.lock.outputs.release }}
    steps:
      - uses: actions/checkout@v7

      - name: Read lock
        id: lock
        shell: bash
        run: |
          value() {
            awk -v key="$1" '$1 == key { print $2; n++ } END { exit n == 1 ? 0 : 1 }' "$LOCK" \
              || { echo "::error::$LOCK must contain exactly one '$1' line"; exit 1; }
          }
          llama_cpp_tag="$(value llama_cpp_tag)"
          release="$(value release)"
          [[ "$llama_cpp_tag" =~ ^b[0-9]+$ ]] || { echo "::error::bad llama_cpp_tag '$llama_cpp_tag'"; exit 1; }
          [[ "$release" =~ ^llama/${llama_cpp_tag}-r[0-9]+$ ]] \
            || { echo "::error::release '$release' must be llama/${llama_cpp_tag}-r<N>"; exit 1; }
          echo "llama_cpp_tag=$llama_cpp_tag" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "Pinned llama.cpp $llama_cpp_tag, release $release"

      - name: Check the tag matches the lock and is unpublished
        if: startsWith(github.ref, 'refs/tags/llama/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE: ${{ steps.lock.outputs.release }}
        run: |
          if [[ "$GITHUB_REF_NAME" != "$RELEASE" ]]; then
            echo "::error::Pushed tag $GITHUB_REF_NAME does not match lock release $RELEASE"
            exit 1
          fi
          if gh release view "$RELEASE" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release $RELEASE already exists; published releases are immutable. Bump the -rN suffix."
            exit 1
          fi

  build:
    name: ${{ matrix.name }}
    needs: pin
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Apple Silicon only: Intel Macs would need a CPU-only binary.
          - name: macOS arm64 (Metal)
            os: macos-14
            file: llama-server-aarch64-apple-darwin
            backend: -DGGML_METAL=ON -DGGML_METAL_EMBED_LIBRARY=ON -DGGML_METAL_USE_BF16=ON
          # Vulkan covers NVIDIA, AMD and Intel GPUs without the CUDA toolchain.
          - name: Windows x64 (Vulkan)
            os: windows-2022
            file: llama-server-x86_64-pc-windows-msvc.exe
            vulkan: true
            backend: -DGGML_VULKAN=ON
          # Spawned when the Vulkan binary cannot start or initialise.
          - name: Windows x64 (CPU)
            os: windows-2022
            file: llama-server-cpu-x86_64-pc-windows-msvc.exe
            backend: ''
          # ubuntu-22.04 keeps the glibc requirement at 2.35 (lock glibc_max).
          - name: Linux x64 (Vulkan)
            os: ubuntu-22.04
            file: llama-server-x86_64-unknown-linux-gnu
            vulkan: true
            backend: -DGGML_VULKAN=ON
          - name: Linux x64 (CPU)
            os: ubuntu-22.04
            file: llama-server-cpu-x86_64-unknown-linux-gnu
            backend: ''
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install Vulkan SDK
        if: matrix.vulkan
        uses: jakoch/install-vulkan-sdk-action@v1.6.0
        with:
          vulkan_version: ${{ env.VULKAN_SDK_VERSION }}
          install_runtime: true
          cache: true
          stripdown: true

      # Users' GPU drivers install the Vulkan loader system-wide. Mirror that so
      # the smoke test (scrubbed environment) runs the binary instead of skipping.
      - name: Install Vulkan loader (Linux)
        if: matrix.vulkan && runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libvulkan1

      - name: Install Vulkan loader (Windows)
        if: matrix.vulkan && runner.os == 'Windows'
        shell: pwsh
        run: Copy-Item "C:\VulkanSDK\$env:VULKAN_SDK_VERSION\runtime\x64\vulkan-1.dll" "$env:SystemRoot\System32\vulkan-1.dll" -Force

      # Full commit history without file contents, so the binary reports the
      # real build number instead of `1`.
      - name: Clone llama.cpp
        shell: bash
        env:
          TAG: ${{ needs.pin.outputs.llama_cpp_tag }}
        run: |
          git clone --filter=blob:none --branch "$TAG" https://github.com/ggml-org/llama.cpp.git llama.cpp
          git -C llama.cpp rev-parse HEAD

      - name: Configure
        shell: bash
        working-directory: llama.cpp
        env:
          BACKEND: ${{ matrix.backend }}
        run: |
          macos_min="$(awk '$1 == "macos_min" { print $2 }' "../$LOCK")"
          args=(
            -DCMAKE_BUILD_TYPE=Release
            # CMake would otherwise embed the runner's Vulkan SDK directory.
            -DCMAKE_SKIP_RPATH=ON
            -DBUILD_SHARED_LIBS=OFF
            -DGGML_NATIVE=OFF
            -DGGML_OPENMP=OFF
            -DLLAMA_CURL=OFF
            -DLLAMA_OPENSSL=OFF
            -DLLAMA_BUILD_SERVER=ON
            -DLLAMA_BUILD_TESTS=OFF
            -DLLAMA_BUILD_EXAMPLES=OFF
          )
          case "$RUNNER_OS" in
            macOS)
              args+=(-DCMAKE_OSX_DEPLOYMENT_TARGET="$macos_min") ;;
            Windows)
              # Static MSVC runtime: no VCRUNTIME140.dll / MSVCP140.dll needed.
              args+=(-DCMAKE_POLICY_DEFAULT_CMP0091=NEW -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded) ;;
            Linux)
              args+=("-DCMAKE_EXE_LINKER_FLAGS=-static-libstdc++ -static-libgcc") ;;
          esac
          # shellcheck disable=SC2206 # backend flags are space-separated on purpose
          args+=($BACKEND)
          cmake -B build "${args[@]}"

      - name: Build
        shell: bash
        working-directory: llama.cpp
        # Two jobs: a single compile of ggml-vulkan.cpp peaks near 2 GB, and
        # unbounded parallelism has OOM-killed the linker on hosted runners.
        run: cmake --build build --config Release --target llama-server -j 2

      - name: Stage and remove the build tree
        shell: bash
        env:
          FILE: ${{ matrix.file }}
        run: |
          mkdir -p staging
          if [[ "$RUNNER_OS" == Windows ]]; then
            cp llama.cpp/build/bin/Release/llama-server.exe "staging/$FILE"
          else
            cp llama.cpp/build/bin/llama-server "staging/$FILE"
            chmod +x "staging/$FILE"
          fi
          {
            echo "file $FILE"
            echo "llama_cpp_tag ${{ needs.pin.outputs.llama_cpp_tag }}"
            echo "llama_cpp_commit $(git -C llama.cpp rev-parse HEAD)"
            echo "runner ${ImageOS:-unknown} ${ImageVersion:-unknown}"
            echo "backend ${{ matrix.backend }}"
          } > "staging/$FILE.build-info"
          # Nothing the binary could have linked against survives this step.
          rm -rf llama.cpp

      # Checksums in the lock belong to the previous release, not this build.
      - name: Verify self-contained and runnable
        shell: bash
        run: |
          grep -v '^sha256 ' "$LOCK" > "$RUNNER_TEMP/unhashed.lock"
          python "$VERIFY" --lock "$RUNNER_TEMP/unhashed.lock" --run --strict "staging/${{ matrix.file }}"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.file }}
          path: staging/
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish release
    needs: [pin, build]
    if: startsWith(github.ref, 'refs/tags/llama/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - uses: actions/download-artifact@v8
        with:
          path: release
          merge-multiple: true

      - name: Collect build info
        working-directory: release
        run: |
          cat ./*.build-info > BUILD-INFO.txt
          rm ./*.build-info
          cat BUILD-INFO.txt

      - name: Verify the complete set
        run: |
          grep -v '^sha256 ' "$LOCK" > "$RUNNER_TEMP/unhashed.lock"
          python "$VERIFY" --lock "$RUNNER_TEMP/unhashed.lock" --expect-all release

      - name: Checksums
        working-directory: release
        run: |
          sha256sum llama-server-* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish (never overwrites)
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE: ${{ needs.pin.outputs.release }}
          LLAMA_CPP_TAG: ${{ needs.pin.outputs.llama_cpp_tag }}
        run: |
          cat > notes.md <<EOF
          llama-server sidecar binaries for Lattice, built from llama.cpp \`$LLAMA_CPP_TAG\`.

          | File | Platform | Backend |
          |---|---|---|
          | \`llama-server-aarch64-apple-darwin\` | macOS Apple Silicon | Metal |
          | \`llama-server-x86_64-pc-windows-msvc.exe\` | Windows x64 | Vulkan |
          | \`llama-server-cpu-x86_64-pc-windows-msvc.exe\` | Windows x64 | CPU (AVX2) |
          | \`llama-server-x86_64-unknown-linux-gnu\` | Linux x64 | Vulkan |
          | \`llama-server-cpu-x86_64-unknown-linux-gnu\` | Linux x64 | CPU (AVX2) |

          Each file is self-contained and was verified by \`verify_llama_binaries.py\`.
          Pin these checksums with \`bash src-tauri/scripts/fetch-llama-binaries.sh --update-lock\`.
          EOF
          # `gh release create` fails if the release exists, so a tag can never
          # be republished with different bytes.
          gh release create "$RELEASE" release/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "llama-server $LLAMA_CPP_TAG (${RELEASE##*-})" \
            --notes-file notes.md
