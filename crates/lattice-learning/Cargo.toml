[package]
name = "lattice-learning"
version = "1.0.0"
edition = "2021"
license = "MIT"
publish = false

[lints]
workspace = true

[lib]
doctest = false

[dependencies]
lattice-core = { path = "../lattice-core" }
lattice-index = { path = "../lattice-index" }
lattice-store = { path = "../lattice-store" }
anyhow = { workspace = true }
async-trait = { workspace = true }
chrono = { workspace = true }
dirs = { workspace = true }
fsrs = "=6.6.2"
futures = { workspace = true }
jsonschema = { version = "0.17", default-features = false }
lazy-regex = "3"
parking_lot = { workspace = true }
rand = { workspace = true }
regex = { workspace = true }
rquickjs = { version = "=0.14.0", default-features = false, features = ["std", "loader"], optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
specta = { workspace = true }
sqlx = { workspace = true }
tar = "0.4"
tauri-utils = "2.9.3"
tempfile = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
unicode-normalization = { workspace = true }
url = { workspace = true }
uuid = { workspace = true }
wasmtime = { version = "=48.0.8", default-features = false, features = ["cranelift", "runtime", "std"], optional = true }
wasmtime-wasi = { version = "=48.0.8", default-features = false, features = ["p1"], optional = true }
zstd = "0.14"

[dev-dependencies]
lattice-core = { path = "../lattice-core", features = ["test-support"] }
lattice-index = { path = "../lattice-index", features = ["test-support"] }
futures = { workspace = true }
rand = { workspace = true }
reqwest = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
tracing-subscriber = { workspace = true }
walkdir = "2.5"
wiremock = "0.6"

[features]
default = ["learning-labs"]
learning-labs = ["dep:rquickjs", "dep:wasmtime", "dep:wasmtime-wasi"]
# Helpers the live evals in lattice-desktop reach; only its dev-dependency enables it.
test-support = []
