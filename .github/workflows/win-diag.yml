# TEMPORARY diagnostic for cargo check (windows-latest) failing with
# STATUS_ENTRYPOINT_NOT_FOUND. Delete once the cause is fixed.
name: win-diag
on:
  push:
    branches: [diag/windows-entrypoint]
  workflow_dispatch:

jobs:
  diag:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      # Reuse the CI job's cache so we don't pay a cold 12-minute build.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src-tauri/target/
          key: cargo-windows-latest-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: cargo-windows-latest-

      - name: Placeholders
        shell: bash
        run: |
          mkdir -p dist
          touch src-tauri/binaries/llama-server-x86_64-pc-windows-msvc.exe \
                src-tauri/binaries/llama-server-cpu-x86_64-pc-windows-msvc.exe

      - name: Build the test binary
        working-directory: src-tauri
        run: cargo test --lib --no-run --message-format=json > build.json

      - name: Locate the test exe
        id: exe
        shell: pwsh
        working-directory: src-tauri
        run: |
          $exe = (Get-Content build.json | ForEach-Object { $_ | ConvertFrom-Json } |
            Where-Object { $_.reason -eq 'compiler-artifact' -and $_.target.name -eq 'lattice' -and $_.profile.test -eq $true } |
            Select-Object -Last 1).executable
          Write-Host "EXE=$exe"
          "exe=$exe" >> $env:GITHUB_OUTPUT

      - name: Imported DLLs
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $dumpbin = Get-ChildItem "$vs\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" | Select-Object -Last 1
          Write-Host "== dumpbin: $dumpbin"
          & $dumpbin /dependents "${{ steps.exe.outputs.exe }}"

      - name: Versions of the usual suspects
        shell: pwsh
        continue-on-error: true
        run: |
          foreach ($n in 'msvcp140.dll','msvcp140_1.dll','vcruntime140.dll','vcruntime140_1.dll','msvcp140_atomic_wait.dll') {
            $p = "C:\Windows\System32\$n"
            if (Test-Path $p) {
              $v = (Get-Item $p).VersionInfo.FileVersion
              Write-Host "System32 $n = $v"
            } else { Write-Host "System32 $n = MISSING" }
          }
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          Get-ChildItem "$vs\VC\Redist\MSVC\*\x64\Microsoft.VC143.CRT\*.dll" |
            ForEach-Object { Write-Host "redist $($_.Name) = $($_.VersionInfo.FileVersion)  [$($_.DirectoryName)]" }

      - name: Run it as CI does (expected to fail)
        id: plain
        shell: pwsh
        continue-on-error: true
        run: |
          & "${{ steps.exe.outputs.exe }}" --list | Select-Object -First 3
          Write-Host "EXITCODE=$LASTEXITCODE"

      - name: HYPOTHESIS - run with the toolset redist on PATH
        shell: pwsh
        continue-on-error: true
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $crt = (Get-ChildItem "$vs\VC\Redist\MSVC\*\x64\Microsoft.VC143.CRT" -Directory | Select-Object -Last 1).FullName
          Write-Host "Prepending: $crt"
          $env:PATH = "$crt;$env:PATH"
          & "${{ steps.exe.outputs.exe }}" --list | Select-Object -First 3
          Write-Host "EXITCODE_WITH_REDIST=$LASTEXITCODE"

      - name: HYPOTHESIS - copy redist DLLs next to the exe
        shell: pwsh
        continue-on-error: true
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $crt = (Get-ChildItem "$vs\VC\Redist\MSVC\*\x64\Microsoft.VC143.CRT" -Directory | Select-Object -Last 1).FullName
          Copy-Item "$crt\*.dll" (Split-Path "${{ steps.exe.outputs.exe }}") -Force
          & "${{ steps.exe.outputs.exe }}" --list | Select-Object -First 3
          Write-Host "EXITCODE_WITH_LOCAL_DLLS=$LASTEXITCODE"
