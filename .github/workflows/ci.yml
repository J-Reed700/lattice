name: CI

on:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  VULKAN_RUNTIME_VERSION: 1.4.363.0

jobs:
  ubuntu-test-build:
    name: Ubuntu test build (${{ matrix.variant }})
    runs-on: ubuntu-24.04
    env:
      LATTICE_ALLOW_UNPINNED_SIDECAR: '0'
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: as-is
            incremental: ''
            debug: ''
          - variant: incremental off, line tables only
            incremental: '0'
            debug: line-tables-only
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install Linux system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Runner resources before the build
        run: |
          nproc
          free -m
          swapon --show || true
          df -h / /mnt || true

      - name: Create build placeholders for source checks
        run: |
          mkdir -p dist
          touch crates/lattice-desktop/binaries/llama-server-x86_64-unknown-linux-gnu \
                crates/lattice-desktop/binaries/llama-server-cpu-x86_64-unknown-linux-gnu

      - name: cargo check, then the test build, sampling resources every 5 s
        working-directory: crates/lattice-desktop
        shell: bash
        run: |
          if [ -n "${{ matrix.incremental }}" ]; then export CARGO_INCREMENTAL="${{ matrix.incremental }}"; fi
          if [ -n "${{ matrix.debug }}" ]; then export CARGO_PROFILE_DEV_DEBUG="${{ matrix.debug }}"; fi
          (
            while sleep 5; do
              m=$(awk '/^MemTotal:/{t=$2} /^MemAvailable:/{a=$2} /^SwapTotal:/{st=$2} /^SwapFree:/{sf=$2} END{printf "memory available %d of %d MB, swap used %d of %d MB", a/1024, t/1024, (st-sf)/1024, st/1024}' /proc/meminfo)
              d=$(df -BM --output=avail / | tail -1 | tr -d ' ')
              o=$(sudo dmesg 2>/dev/null | grep -ciE 'out of memory|oom-kill' || true)
              p=$(ps -eo rss=,comm= --sort=-rss | head -4 | awk '{printf "%s %d MB; ", $2, $1/1024}')
              echo "resources: $m; disk free $d on /; oom kills $o; largest: $p"
            done
          ) &
          sampler=$!
          trap 'kill $sampler' EXIT
          cargo check --workspace --all-targets
          cargo test --locked --workspace --features lattice-desktop/bindings-export --lib --bins --tests --no-fail-fast --no-run
          du -sh "$GITHUB_WORKSPACE/target" || true
